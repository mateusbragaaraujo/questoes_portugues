so-oficial.html"},{"id":"crase-115","frase":"O governo aumentou à quantidade de subsídios.","destaque":"à quantidade","correta":false,"explicacao":"Não é o gabarito. “Aumentar” é transitivo direto: “aumentou a quantidade”, artigo sem preposição, sem crase. fonte: grok","regra":"Artigo sem preposição: sem crase.","fonte":"Cesgranrio – 2010 – TJ-RO. Gabarito: C. http://portugues-concursos.blogspot.com/2014/04/exercicios-sobre-crase-concurso-oficial.html"},{"id":"crase-116","frase":"A empresa considerou a oferta inferior à outra.","destaque":"à outra","correta":true,"explicacao":"É a alternativa do gabarito. “Inferior” pede “a”, e “outra” retoma oferta, feminino determinado: a + a = à. fonte: grok","regra":"Preposição “a” + artigo feminino.","fonte":"Cesgranrio – 2010 – TJ-RO. Gabarito: C. http://portugues-concursos.blogspot.com/2014/04/exercicios-sobre-crase-concurso-oficial.html"},{"id":"crase-117","frase":"Ele está propenso à deixar o cargo.","destaque":"à deixar","correta":false,"explicacao":"Não é o gabarito. Não há crase antes de verbo no infinitivo. O correto é “propenso a deixar”. fonte: grok","regra":"Sem crase antes de verbo.","fonte":"Cesgranrio – 2010 – TJ-RO. Gabarito: C. http://portugues-concursos.blogspot.com/2014/04/exercicios-sobre-crase-concurso-oficial.html"},{"id":"crase-118","frase":"Não vou aderir à modismos passageiros.","destaque":"à modismos","correta":false,"explicacao":"Não é o gabarito. “À” no singular não se funde com substantivo no plural. Cabe “a modismos” ou “aos modismos”. fonte: grok","regra":"“A” singular antes de palavra no plural.","fonte":"Cesgranrio – 2010 – TJ-RO. Gabarito: C. http://portugues-concursos.blogspot.com/2014/04/exercicios-sobre-crase-concurso-oficial.html"},{"id":"crase-119","frase":"É preciso comparecer a festas.","destaque":"a festas","correta":true,"explicacao":"A frase está escrita de acordo com a norma. “Festas” no plural, sem artigo, recebe só a preposição de “comparecer”. fonte: grok","regra":"Preposição sem artigo, diante de plural genérico.","fonte":"Vunesp – 2010 – TJ-SP. Gabarito: C. http://portugues-concursos.blogspot.com/2014/04/exercicios-sobre-crase-concurso-oficial.html"},{"id":"crase-120","frase":"Vai pagar a perder de vista.","destaque":"a perder","correta":true,"explicacao":"A expressão “a perder de vista” não leva crase: “perder” é verbo, e não há artigo feminino. fonte: grok","regra":"Sem crase antes de verbo.","fonte":"Vunesp – 2010 – TJ-SP. Gabarito: C. http://portugues-concursos.blogspot.com/2014/04/exercicios-sobre-crase-concurso-oficial.html"},{"id":"crase-121","frase":"Gostava de andar a cavalo.","destaque":"a cavalo","correta":true,"explicacao":"É a alternativa do gabarito, e a grafia está certa. “Cavalo” é masculino: “a cavalo”, sem acento grave. fonte: grok","regra":"Sem crase antes de palavra masculina.","fonte":"Vunesp – 2010 – TJ-SP. Gabarito: C. http://portugues-concursos.blogspot.com/2014/04/exercicios-sobre-crase-concurso-oficial.html"},{"id":"crase-122","frase":"Viajou a Brasília.","destaque":"a Brasília","correta":true,"explicacao":"A frase está certa. “Brasília”, sem especificador, não admite artigo: volta-se de Brasília, vai-se a Brasília. fonte: grok","regra":"Cidade sem artigo: sem crase.","fonte":"Vunesp – 2010 – TJ-SP. Gabarito: C. http://portugues-concursos.blogspot.com/2014/04/exercicios-sobre-crase-concurso-oficial.html"},{"id":"crase-123","frase":"Vai começar a viajar.","destaque":"a viajar","correta":true,"explicacao":"A frase está certa. “Viajar” é infinitivo e não admite artigo. Sem artigo, a preposição “a” não se funde e não há crase. fonte: grok","regra":"Sem crase antes de verbo.","fonte":"Vunesp – 2010 – TJ-SP. Gabarito: C. http://portugues-concursos.blogspot.com/2014/04/exercicios-sobre-crase-concurso-oficial.html"},{"id":"crase-124","frase":"Doenças ocasionadas pelo uso de pesticidas em alimentos podem levar a morte.","destaque":"a morte","correta":false,"explicacao":"Não é o gabarito. No contexto da prova, “levar a” pede preposição e “morte” admite artigo: a forma pedida é “levar à morte”. fonte: grok","regra":"Omissão da crase obrigatória.","fonte":"Vunesp – 2011 – Cremesp. Gabarito: C. http://portugues-concursos.blogspot.com/2014/04/exercicios-sobre-crase-concurso-oficial.html"},{"id":"crase-125","frase":"As pessoas são obrigadas à parar de comer alimentos com agrotóxicos.","destaque":"à parar","correta":false,"explicacao":"Não é o gabarito. “Parar” é verbo no infinitivo. Não se usa crase antes de infinitivo; o correto é “obrigadas a parar”. fonte: grok","regra":"Sem crase antes de verbo.","fonte":"Vunesp – 2011 – Cremesp. Gabarito: C. http://portugues-concursos.blogspot.com/2014/04/exercicios-sobre-crase-concurso-oficial.html"},{"id":"crase-126","frase":"Os dados da pesquisa da Anvisa referem-se a alimentos in natura.","destaque":"a alimentos","correta":true,"explicacao":"É a alternativa do gabarito. “Alimentos” é masculino plural: “referem-se a alimentos”, sem crase. fonte: grok","regra":"Sem crase antes de palavra masculina.","fonte":"Vunesp – 2011 – Cremesp. Gabarito: C. http://portugues-concursos.blogspot.com/2014/04/exercicios-sobre-crase-concurso-oficial.html"},{"id":"crase-127","frase":"A medida que as pesquisas avançam, mais testes com animais são feitos.","destaque":"A medida","correta":false,"explicacao":"Não é o gabarito. A locução proporcional é “à medida que”, com crase. “A medida que” omite o acento. fonte: grok","regra":"Locução conjuntiva feminina.","fonte":"Vunesp – 2011 – Cremesp. Gabarito: C. http://portugues-concursos.blogspot.com/2014/04/exercicios-sobre-crase-concurso-oficial.html"},{"id":"crase-128","frase":"Os trabalhadores rurais devem se submeter à uma avaliação médica constante.","destaque":"à uma","correta":false,"explicacao":"Não é o gabarito. Não há crase antes de artigo indefinido. O correto é “a uma avaliação”. fonte: grok","regra":"Proibido antes de artigo indefinido.","fonte":"Vunesp – 2011 – Cremesp. Gabarito: C. http://portugues-concursos.blogspot.com/2014/04/exercicios-sobre-crase-concurso-oficial.html"},{"id":"crase-129","frase":"Não se pode esquecer a ajuda técnica e material que os Estados Unidos, Canadá e China ofereceram à equipe chilena de salvamento.","destaque":"à equipe","correta":true,"explicacao":"O gabarito da FGV justifica o acento nesse trecho do texto. “Oferecer” pede a preposição “a”, e “equipe” admite o artigo feminino: a + a = à. fonte: grok","regra":"Preposição “a” + artigo feminino.","fonte":"FGV – 2010 – DETRAN-RN. Gabarito: A. http://portugues-concursos.blogspot.com/2014/04/exercicios-sobre-crase-concurso-oficial.html"},{"id":"crase-130","frase":"O autor se comparou à alguém que tem boa memória.","destaque":"à alguém","correta":false,"explicacao":"Não é o gabarito. “Alguém” é pronome indefinido e não admite artigo. “Comparar-se” pede só a preposição: “a alguém”. fonte: grok","regra":"Sem crase antes de pronome indefinido.","fonte":"FGV – 2010 – DETRAN-RN. Gabarito: B. http://portugues-concursos.blogspot.com/2014/04/exercicios-sobre-crase-concurso-oficial.html"},{"id":"crase-131","frase":"Ele se referiu às pessoas de boa memória.","destaque":"às pessoas","correta":true,"explicacao":"É a alternativa do gabarito. “Referir-se” pede “a”, e “pessoas” está no feminino plural: às. fonte: grok","regra":"Preposição “a” + artigo “as”.","fonte":"FGV – 2010 – DETRAN-RN. Gabarito: B. http://portugues-concursos.blogspot.com/2014/04/exercicios-sobre-crase-concurso-oficial.html"},{"id":"crase-132","frase":"As pessoas aludem à uma causa específica.","destaque":"à uma","correta":false,"explicacao":"Não é o gabarito. “Uma” é artigo indefinido. A crase não ocorre: “aludem a uma causa”. fonte: grok","regra":"Proibido antes de artigo indefinido.","fonte":"FGV – 2010 – DETRAN-RN. Gabarito: B. http://portugues-concursos.blogspot.com/2014/04/exercicios-sobre-crase-concurso-oficial.html"},{"id":"crase-133","frase":"Ele passou a ser entendido à partir de suas reflexões sobre a memória.","destaque":"à partir","correta":false,"explicacao":"Não é o gabarito. “A partir de” é locução sem crase: “partir” não admite artigo. fonte: grok","regra":"Sem crase em “a partir de”.","fonte":"FGV – 2010 – DETRAN-RN. Gabarito: B. http://portugues-concursos.blogspot.com/2014/04/exercicios-sobre-crase-concurso-oficial.html"},{"id":"crase-134","frase":"Os livros foram entregues à ele.","destaque":"à ele","correta":false,"explicacao":"Não é o gabarito. Não há crase antes de pronome pessoal. O correto é “entregues a ele”. fonte: grok","regra":"Sem crase antes de pronome pessoal.","fonte":"FGV – 2010 – DETRAN-RN. Gabarito: B. http://portugues-concursos.blogspot.com/2014/04/exercicios-sobre-crase-concurso-oficial.html"},{"id":"crase-135","frase":"A erupção de um vulcão provocou perdas à economia europeia.","destaque":"à economia","correta":true,"explicacao":"O gabarito da FCC preenche a primeira lacuna com “à”. “Perda” pede “a”, e “economia” admite o artigo feminino: a + a = à. fonte: grok","regra":"Preposição “a” + artigo feminino.","fonte":"FCC – 2010 – TRT da 9.ª Região. Gabarito: E. http://portugues-concursos.blogspot.com/2014/04/exercicios-sobre-crase-concurso-oficial.html"},{"id":"crase-136","frase":"As perdas foram bem superiores àquelas trazidas pelos atentados terroristas de 2001.","destaque":"àquelas","correta":true,"explicacao":"O gabarito preenche a segunda lacuna com “àquelas”. “Superior” pede a preposição “a”, que se funde ao “a” inicial do demonstrativo. fonte: grok","regra":"Crase com pronome demonstrativo.","fonte":"FCC – 2010 – TRT da 9.ª Região. Gabarito: E. http://portugues-concursos.blogspot.com/2014/04/exercicios-sobre-crase-concurso-oficial.html"},{"id":"crase-137","frase":"O fato obrigou a ONU a criar um plano internacional de redução dos riscos de acidentes.","destaque":"a criar","correta":true,"explicacao":"O gabarito preenche a terceira lacuna com “a”, sem acento. “Criar” é infinitivo e não admite artigo, portanto não há crase. fonte: grok","regra":"Sem crase antes de verbo.","fonte":"FCC – 2010 – TRT da 9.ª Região. Gabarito: E. http://portugues-concursos.blogspot.com/2014/04/exercicios-sobre-crase-concurso-oficial.html"},{"id":"crase-138","frase":"Deve haver muitas mudanças neste projeto a serem sugeridas à construtora.","destaque":"à construtora","correta":true,"explicacao":"O gabarito da ACAFE traz “à” antes de “construtora”. “Sugeridas” pede “a”, e o substantivo feminino determinado admite artigo. fonte: grok","regra":"Preposição “a” + artigo feminino.","fonte":"ACAFE – 2010 – Polícia Civil de SC. Gabarito: B. http://portugues-concursos.blogspot.com/2014/04/exercicios-sobre-crase-concurso-oficial.html"},{"id":"crase-139","frase":"O projeto será alterado principalmente quanto às regras do novo código de posturas municipais.","destaque":"às regras","correta":true,"explicacao":"O gabarito preenche “quanto” com “às”. A locução “quanto a” pede preposição, e “regras” está no feminino plural: a + as = às. fonte: grok","regra":"Preposição “a” + artigo “as”.","fonte":"ACAFE – 2010 – Polícia Civil de SC. Gabarito: B. http://portugues-concursos.blogspot.com/2014/04/exercicios-sobre-crase-concurso-oficial.html"},{"id":"crase-140","frase":"O arquiteto pode identificar rapidamente as adaptações necessárias.","destaque":"as adaptações","correta":true,"explicacao":"O gabarito fecha a frase com “as”, sem acento. “Identificar” é transitivo direto: o “as” é só artigo, não há preposição nem crase. fonte: grok","regra":"Artigo sem preposição: sem crase.","fonte":"ACAFE – 2010 – Polícia Civil de SC. Gabarito: B. http://portugues-concursos.blogspot.com/2014/04/exercicios-sobre-crase-concurso-oficial.html"},{"id":"crase-141","frase":"Assim que o processo chegar às mãos do Presidente, o mandato pode ser cassado.","destaque":"às mãos","correta":true,"explicacao":"O gabarito preenche a última lacuna com “às”. “Chegar” pede “a”, e “mãos” admite o artigo feminino plural. fonte: grok","regra":"Preposição “a” + artigo “as”.","fonte":"ACAFE – 2010 – Polícia Civil de SC. Gabarito: D. http://portugues-concursos.blogspot.com/2014/04/exercicios-sobre-crase-concurso-oficial.html"},{"id":"crase-142","frase":"O atendimento ao público ocorre de segunda à sexta-feira.","destaque":"à sexta-feira","correta":false,"explicacao":"A resolução elimina a alternativa: “de segunda” traz só a preposição, então o fim do intervalo é “a sexta-feira”, sem crase. fonte: grok","regra":"Paralelismo: de… a…, não de… à…","fonte":"Estuda Aí. Exercício comentado no perfil da FCC. Gabarito: E. Questão de paralelismo horário. https://estudaae.com.br/exercicio-resolvido/exercicios-de-crase-para-concursos-questoes-comentadas/"},{"id":"crase-143","frase":"O evento será realizado das 14h a 18h na sede do órgão.","destaque":"a 18h","correta":false,"explicacao":"A resolução aponta a quebra de simetria. “Das” já é de + as; o segundo termo tem de ser “às 18h”. fonte: grok","regra":"Paralelismo de horário: de… a… ou das… às…","fonte":"Estuda Aí. Exercício comentado no perfil da FCC. Gabarito: E. Questão de paralelismo horário. https://estudaae.com.br/exercicio-resolvido/exercicios-de-crase-para-concursos-questoes-comentadas/"},{"id":"crase-144","frase":"A exposição estará aberta ao público de 10 às 22 horas.","destaque":"às 22","correta":false,"explicacao":"A resolução chama isso de hipercorreção. O intervalo começa com “de”, então termina em “a 22 horas”, sem crase. fonte: grok","regra":"Paralelismo de horário: de… a… ou das… às…","fonte":"Estuda Aí. Exercício comentado no perfil da FCC. Gabarito: E. Questão de paralelismo horário. https://estudaae.com.br/exercicio-resolvido/exercicios-de-crase-para-concursos-questoes-comentadas/"},{"id":"crase-145","frase":"A reunião foi transferida para às 15 horas.","destaque":"às 15","correta":false,"explicacao":"A resolução elimina a alternativa: “para” já é preposição, e “para às” repete o nexo. O texto corrige para “para as 15 horas”. fonte: grok","regra":"Sem crase depois de outra preposição.","fonte":"Estuda Aí. Exercício comentado no perfil da FCC. Gabarito: E. Questão de paralelismo horário. https://estudaae.com.br/exercicio-resolvido/exercicios-de-crase-para-concursos-questoes-comentadas/"},{"id":"crase-146","frase":"O expediente será mantido das 8h às 17h sem interrupções.","destaque":"às 17h","correta":true,"explicacao":"É o gabarito comentado. “Das 8h” corresponde a “às 17h”: de + as no início, a + as no fim. fonte: grok","regra":"Paralelismo de horário: de… a… ou das… às…","fonte":"Estuda Aí. Exercício comentado no perfil da FCC. Gabarito: E. Questão de paralelismo horário. https://estudaae.com.br/exercicio-resolvido/exercicios-de-crase-para-concursos-questoes-comentadas/"},{"id":"crase-147","frase":"O diretor referiu-se àquelas propostas apresentadas ontem.","destaque":"àquelas","correta":true,"explicacao":"O gabarito comentado preenche a primeira lacuna com “àquelas”. “Referir-se” pede “a”, que se funde ao pronome. fonte: grok","regra":"Crase com pronome demonstrativo.","fonte":"Estuda Aí. Exercício comentado no perfil da FGV. Gabarito: C. Questão de pronome demonstrativo. https://estudaae.com.br/exercicio-resolvido/exercicios-de-crase-para-concursos-questoes-comentadas/"},{"id":"crase-148","frase":"O diretor não fez menção aos projetos do setor financeiro.","destaque":"aos projetos","correta":true,"explicacao":"O gabarito comentado usa “aos”. “Menção” pede “a”, e “projetos” é masculino plural: a + os, sem acento grave. fonte: grok","regra":"Preposição “a” + artigo masculino: sem crase.","fonte":"Estuda Aí. Exercício comentado no perfil da FGV. Gabarito: C. Questão de pronome demonstrativo. https://estudaae.com.br/exercicio-resolvido/exercicios-de-crase-para-concursos-questoes-comentadas/"},{"id":"crase-149","frase":"A comitiva oficial viajará à Roma dos césares para participar de um congresso internacional.","destaque":"à Roma","correta":true,"explicacao":"O item foi julgado certo. “Viajar” pede “a”, e “Roma” especificada por “dos césares” admite artigo. fonte: grok","regra":"Topônimo especificado admite artigo.","fonte":"Estuda Aí. Exercício comentado no perfil da Cebraspe. Gabarito: CERTO. Item de topônimo especificado. https://estudaae.com.br/exercicio-resolvido/exercicios-de-crase-para-concursos-questoes-comentadas/"},{"id":"crase-150","frase":"Chegamos à uma conclusão satisfatória.","destaque":"à uma","correta":false,"explicacao":"A resolução marca a alternativa como incorreta. Não há crase antes do artigo indefinido “uma”. fonte: grok","regra":"Proibido antes de artigo indefinido.","fonte":"Estuda Aí. Exercício comentado no perfil da Vunesp. Gabarito: C. Questão de “à moda de”. https://estudaae.com.br/exercicio-resolvido/exercicios-de-crase-para-concursos-questoes-comentadas/"},{"id":"crase-151","frase":"Entreguei os documentos à secretária do diretor.","destaque":"à secretária","correta":true,"explicacao":"A resolução reconhece a crase como fusão regular: “entregar” pede “a”, e “secretária” admite artigo. O motivo não é o do gabarito, mas a grafia está certa. fonte: grok","regra":"Preposição “a” + artigo feminino.","fonte":"Estuda Aí. Exercício comentado no perfil da Vunesp. Gabarito: C. Questão de “à moda de”. https://estudaae.com.br/exercicio-resolvido/exercicios-de-crase-para-concursos-questoes-comentadas/"},{"id":"crase-152","frase":"Ele escreveu o texto à Machado de Assis.","destaque":"à Machado","correta":true,"explicacao":"É o gabarito comentado. A crase vem de “à moda de” subentendida, mesmo diante do nome masculino. fonte: grok","regra":"“À moda de” subentendida.","fonte":"Estuda Aí. Exercício comentado no perfil da Vunesp. Gabarito: C. Questão de “à moda de”. https://estudaae.com.br/exercicio-resolvido/exercicios-de-crase-para-concursos-questoes-comentadas/"},{"id":"crase-153","frase":"Fomos à pé até o centro da cidade.","destaque":"à pé","correta":false,"explicacao":"A resolução corrige para “a pé”. “Pé” é masculino, e não há locução feminina subentendida. fonte: grok","regra":"Sem crase antes de palavra masculina.","fonte":"Estuda Aí. Exercício comentado no perfil da Vunesp. Gabarito: C. Questão de “à moda de”. https://estudaae.com.br/exercicio-resolvido/exercicios-de-crase-para-concursos-questoes-comentadas/"},{"id":"crase-154","frase":"O aluno dedicou-se à leitura dos clássicos.","destaque":"à leitura","correta":true,"explicacao":"A resolução explica a crase pela regência: “dedicar-se” pede “a”, e “leitura” admite o artigo feminino. fonte: grok","regra":"Preposição “a” + artigo feminino.","fonte":"Estuda Aí. Exercício comentado no perfil da Vunesp. Gabarito: C. Questão de “à moda de”. https://estudaae.com.br/exercicio-resolvido/exercicios-de-crase-para-concursos-questoes-comentadas/"},{"id":"crase-155","frase":"Não me refiro à pessoas que não cumprem prazos.","destaque":"à pessoas","correta":false,"explicacao":"A resolução elimina a alternativa. “À” singular não combina com “pessoas” no plural. Cabe “a pessoas” ou “às pessoas”. fonte: grok","regra":"“A” singular antes de palavra no plural.","fonte":"Estuda Aí. Exercício comentado no perfil da Cesgranrio. Gabarito: C. Questão de crase facultativa. https://estudaae.com.br/exercicio-resolvido/exercicios-de-crase-para-concursos-questoes-comentadas/"},{"id":"crase-156","frase":"O parecer foi encaminhado à Sua Excelência o Ministro.","destaque":"à Sua","correta":false,"explicacao":"A resolução marca erro. Pronome de tratamento iniciado por “Sua” não admite artigo, logo não há crase. fonte: grok","regra":"Sem crase antes de pronome de tratamento.","fonte":"Estuda Aí. Exercício comentado no perfil da Cesgranrio. Gabarito: C. Questão de crase facultativa. https://estudaae.com.br/exercicio-resolvido/exercicios-de-crase-para-concursos-questoes-comentadas/"},{"id":"crase-157","frase":"O autor dedicou a obra à sua mãe e à Maria.","destaque":"à Maria","correta":true,"explicacao":"É o gabarito comentado. “Dedicar” pede “a”. Antes de nome feminino como “Maria”, e também antes de “sua mãe”, a crase é facultativa: “à Maria” está de acordo com a norma. fonte: grok","regra":"Crase facultativa antes de nome feminino.","fonte":"Estuda Aí. Exercício comentado no perfil da Cesgranrio. Gabarito: C. Questão de crase facultativa. https://estudaae.com.br/exercicio-resolvido/exercicios-de-crase-para-concursos-questoes-comentadas/"},{"id":"crase-158","frase":"A decisão foi tomada à portas fechadas.","destaque":"à portas","correta":false,"explicacao":"A resolução corrige o singular antes do plural. Não se escreve “à portas”; cabe “a portas” ou “às portas”. fonte: grok","regra":"“A” singular antes de palavra no plural.","fonte":"Estuda Aí. Exercício comentado no perfil da Cesgranrio. Gabarito: C. Questão de crase facultativa. https://estudaae.com.br/exercicio-resolvido/exercicios-de-crase-para-concursos-questoes-comentadas/"},{"id":"crase-159","frase":"O candidato chegou à partir das 8 horas.","destaque":"à partir","correta":false,"explicacao":"A resolução elimina a alternativa. “Partir” é verbo, e “a partir de” é locução sem artigo. A crase de “à partir” está proibida. fonte: grok","regra":"Sem crase antes de verbo.","fonte":"Estuda Aí. Exercício comentado no perfil da Cesgranrio. Gabarito: C. Questão de crase facultativa. https://estudaae.com.br/exercicio-resolvido/exercicios-de-crase-para-concursos-questoes-comentadas/"},{"id":"crase-160","frase":"O motorista virou à esquerda e seguiu à moda paulistana.","destaque":"à moda","correta":true,"explicacao":"O enunciado comentado traz “à moda paulistana” como locução feminina de modo, com crase obrigatória. fonte: grok","regra":"Locução adverbial feminina.","fonte":"Estuda Aí. Exercício comentado no perfil da Vunesp. Gabarito: C. Enunciado de “à moda de”. https://estudaae.com.br/exercicio-resolvido/exercicios-de-crase-para-concursos-questoes-comentadas/"},{"id":"crase-161","frase":"O atendimento ao público ocorre de segunda a sexta-feira.","destaque":"a sexta-feira","correta":true,"explicacao":"A resolução indica esta como a forma simétrica: começou com “de”, termina com “a”, sem crase. fonte: grok","regra":"Paralelismo: de… a…, não de… à…","fonte":"Estuda Aí. Exercício comentado no perfil da FCC. Gabarito: E. Correção da alternativa A. https://estudaae.com.br/exercicio-resolvido/exercicios-de-crase-para-concursos-questoes-comentadas/"},{"id":"crase-162","frase":"O evento será realizado das 14h às 18h na sede do órgão.","destaque":"às 18h","correta":true,"explicacao":"A resolução restaura o paralelismo. “Das” já é de + as, então o fim do intervalo tem de ser “às 18h”, com crase. fonte: grok","regra":"Paralelismo de horário: de… a… ou das… às…","fonte":"Estuda Aí. Exercício comentado no perfil da FCC. Gabarito: E. Correção da alternativa B. https://estudaae.com.br/exercicio-resolvido/exercicios-de-crase-para-concursos-questoes-comentadas/"},{"id":"crase-163","frase":"A exposição estará aberta ao público de 10 a 22 horas.","destaque":"a 22","correta":true,"explicacao":"A resolução corrige o intervalo para “de 10 a 22 horas”. Começou com a preposição “de”, então termina com “a”, sem artigo e sem crase. fonte: grok","regra":"Paralelismo de horário: de… a… ou das… às…","fonte":"Estuda Aí. Exercício comentado no perfil da FCC. Gabarito: E. Correção da alternativa C. https://estudaae.com.br/exercicio-resolvido/exercicios-de-crase-para-concursos-questoes-comentadas/"},{"id":"crase-164","frase":"Vou a Brasília.","destaque":"a Brasília","correta":true,"explicacao":"O texto afirma que o certo é “Vou a Brasília”: a cidade não admite artigo, e só há a preposição de “ir”. fonte: grok","regra":"Cidade sem artigo: sem crase.","fonte":"Sérgio Nogueira, Dicas de Português, G1, 19/12/2012. Gabarito do artigo: a frase citada está certa. https://g1.globo.com/educacao/blog/dicas-de-portugues/post/saiba-quando-se-deve-usar-a-crase-diante-de-nomes-de-lugar.html"},{"id":"crase-165","frase":"Vou à Bahia.","destaque":"à Bahia","correta":true,"explicacao":"O texto afirma que o certo é “Vou à Bahia”: volta-se da Bahia, então “ir” funde a preposição ao artigo. fonte: grok","regra":"Topônimo que admite artigo feminino.","fonte":"Sérgio Nogueira, Dicas de Português, G1, 19/12/2012. Gabarito do artigo: a frase citada está certa. https://g1.globo.com/educacao/blog/dicas-de-portugues/post/saiba-quando-se-deve-usar-a-crase-diante-de-nomes-de-lugar.html"},{"id":"crase-166","frase":"Vou à China.","destaque":"à China","correta":true,"explicacao":"Sérgio Nogueira indica “Vou à China”. Volta-se da China: há artigo feminino, e “ir” pede “a”, logo a crase é obrigatória. fonte: grok","regra":"Topônimo que admite artigo feminino.","fonte":"Sérgio Nogueira, Dicas de Português, G1, 19/12/2012. Gabarito do artigo: a frase citada está certa. https://g1.globo.com/educacao/blog/dicas-de-portugues/post/saiba-quando-se-deve-usar-a-crase-diante-de-nomes-de-lugar.html"},{"id":"crase-167","frase":"Vou a Israel.","destaque":"a Israel","correta":true,"explicacao":"Sérgio Nogueira aplica o macete da viagem: volta-se de Israel, sem artigo. “Ir” pede só a preposição, e o país não a funde com artigo: “vou a Israel”. fonte: grok","regra":"Topônimo sem artigo: sem crase.","fonte":"Sérgio Nogueira, Dicas de Português, G1, 19/12/2012. Gabarito do artigo: a frase citada está certa. https://g1.globo.com/educacao/blog/dicas-de-portugues/post/saiba-quando-se-deve-usar-a-crase-diante-de-nomes-de-lugar.html"},{"id":"crase-168","frase":"Vou à Paraíba.","destaque":"à Paraíba","correta":true,"explicacao":"Sérgio Nogueira indica “vou à Paraíba”, porque se volta da Paraíba. O estado admite artigo feminino, e a preposição de “ir” se funde a ele. fonte: grok","regra":"Topônimo que admite artigo feminino.","fonte":"Sérgio Nogueira, Dicas de Português, G1, 19/12/2012. Gabarito do artigo: a frase citada está certa. https://g1.globo.com/educacao/blog/dicas-de-portugues/post/saiba-quando-se-deve-usar-a-crase-diante-de-nomes-de-lugar.html"},{"id":"crase-169","frase":"Vou a Goiás.","destaque":"a Goiás","correta":true,"explicacao":"Sérgio Nogueira indica “vou a Goiás”.
