explicacao":"O Acordo escreve “antiaéreo”. “Anti-aéreo” usa hífen onde as vogais diferentes se aglutinam. fonte: grok","regra":"Base XVI: vogais diferentes se aglutinam.","fonte":"Acordo Ortográfico da Língua Portuguesa de 1990, Base XVI, 2.º, alínea b. Gabarito: antiaéreo. http://www.portaldalinguaportuguesa.org/?action=acordo&id=16-2&version=1990 Texto do Acordo Ortográfico de 1990: http://www.portaldalinguaportuguesa.org/?action=acordo&version=1990"},{"id":"hifen-166","frase":"extra-escolar","destaque":"extra-escolar","correta":false,"explicacao":"A forma listada é “extraescolar”. “Extra-escolar” conserva hífen entre vogais diferentes. fonte: grok","regra":"Base XVI: vogais diferentes se aglutinam.","fonte":"Acordo Ortográfico da Língua Portuguesa de 1990, Base XVI, 2.º, alínea b. Gabarito: extraescolar. http://www.portaldalinguaportuguesa.org/?action=acordo&id=16-2&version=1990 Texto do Acordo Ortográfico de 1990: http://www.portaldalinguaportuguesa.org/?action=acordo&version=1990"},{"id":"hifen-167","frase":"guarda chuva","destaque":"guarda chuva","correta":false,"explicacao":"O exemplo oficial é “guarda-chuva”, com hífen. A grafia separada desfaz o composto. fonte: grok","regra":"Base XV: composto com acento próprio.","fonte":"Acordo Ortográfico da Língua Portuguesa de 1990, Base XV, 1.º. Gabarito: guarda-chuva. http://www.portaldalinguaportuguesa.org/?action=acordo&id=15-1&version=1990 Texto do Acordo Ortográfico de 1990: http://www.portaldalinguaportuguesa.org/?action=acordo&version=1990"},{"id":"hifen-168","frase":"arco íris","destaque":"arco íris","correta":false,"explicacao":"O Acordo grafa “arco-íris”, com hífen e com acento no i. “Arco íris” separa o composto e perde o acento. fonte: grok","regra":"Base XV: composto com acento próprio.","fonte":"Acordo Ortográfico da Língua Portuguesa de 1990, Base XV, 1.º. Gabarito: arco-íris. http://www.portaldalinguaportuguesa.org/?action=acordo&id=15-1&version=1990 Texto do Acordo Ortográfico de 1990: http://www.portaldalinguaportuguesa.org/?action=acordo&version=1990"},{"id":"hifen-169","frase":"bem aventurado","destaque":"bem aventurado","correta":false,"explicacao":"A forma do Acordo é “bem-aventurado”. Sem hífen, “bem” deixa de fazer o composto. fonte: grok","regra":"Base XV: “bem” + vogal ou “h”.","fonte":"Acordo Ortográfico da Língua Portuguesa de 1990, Base XV, 4.º. Gabarito: bem-aventurado. http://www.portaldalinguaportuguesa.org/?action=acordo&id=15-4&version=1990 Texto do Acordo Ortográfico de 1990: http://www.portaldalinguaportuguesa.org/?action=acordo&version=1990"},{"id":"hifen-170","frase":"malestar","destaque":"malestar","correta":false,"explicacao":"O texto registra “mal-estar”, com hífen. “Malestar” aglutina o que deve ficar separado por hífen. fonte: grok","regra":"Base XV: “mal” + vogal ou “h”.","fonte":"Acordo Ortográfico da Língua Portuguesa de 1990, Base XV, 4.º. Gabarito: mal-estar. http://www.portaldalinguaportuguesa.org/?action=acordo&id=15-4&version=1990 Texto do Acordo Ortográfico de 1990: http://www.portaldalinguaportuguesa.org/?action=acordo&version=1990"},{"id":"hifen-171","frase":"mal-criado","destaque":"mal-criado","correta":false,"explicacao":"O Acordo contrapõe “malcriado” a “bem-criado”: diante de consoante, “mal” não leva hífen. fonte: grok","regra":"Base XV: “mal” + consoante se aglutina.","fonte":"Acordo Ortográfico da Língua Portuguesa de 1990, Base XV, 4.º. Gabarito: malcriado. http://www.portaldalinguaportuguesa.org/?action=acordo&id=15-4&version=1990 Texto do Acordo Ortográfico de 1990: http://www.portaldalinguaportuguesa.org/?action=acordo&version=1990"},{"id":"hifen-172","frase":"bemcriado","destaque":"bemcriado","correta":false,"explicacao":"O par do Acordo é “bem-criado”, com hífen, ao lado de “malcriado”, sem hífen. “Bem” pode manter o hífen antes de consoante. fonte: grok","regra":"Base XV: “bem” pode manter hífen antes de consoante.","fonte":"Acordo Ortográfico da Língua Portuguesa de 1990, Base XV, 4.º. Gabarito: bem-criado. ht ","fonte":"Acordo Ortográfico da Língua Portuguesa de 1990, Base XV, 1.º, observação. Gabarito: madressilva. http://www.portaldalinguaportuguesa.org/?action=acordo&id=15-1&version=1990 Texto do Acordo Ortográfico de 1990: http://www.portaldalinguaportuguesa.org/?action=acordo&version=1990"},{"id":"hifen-177","frase":"fim-de-semana","destaque":"fim-de-semana","correta":false,"explicacao":"A Base XV dá “fim de semana” como locução sem hífen. “Fim-de-semana” hifeniza o que ficou solto. fonte: grok","regra":"Base XV: locução substantiva sem hífen.","fonte":"Acordo Ortográfico da Língua Portuguesa de 1990, Base XV, 6.º. Gabarito: fim de semana. http://www.portaldalinguaportuguesa.org/?action=acordo&id=15-6&version=1990 Texto do Acordo Ortográfico de 1990: http://www.portaldalinguaportuguesa.org/?action=acordo&version=1990"},{"id":"hifen-178","frase":"cão-de-guarda","destaque":"cão-de-guarda","correta":false,"explicacao":"O exemplo oficial é “cão de guarda”, sem hífen. A forma hifenizada não é a da locução. fonte: grok","regra":"Base XV: locução substantiva sem hífen.","fonte":"Acordo Ortográfico da Língua Portuguesa de 1990, Base XV, 6.º. Gabarito: cão de guarda. http://www.portaldalinguaportuguesa.org/?action=acordo&id=15-6&version=1990 Texto do Acordo Ortográfico de 1990: http://www.portaldalinguaportuguesa.org/?action=acordo&version=1990"},{"id":"hifen-179","frase":"América-do-Sul","destaque":"América-do-Sul","correta":false,"explicacao":"O Acordo escreve “América do Sul” com os elementos separados. O hífen não entra nesse topônimo. fonte: grok","regra":"Base XV: topônimo composto sem hífen.","fonte":"Acordo Ortográfico da Língua Portuguesa de 1990, Base XV, topônimos. Gabarito: América do Sul. https://umportugues.com/acordo/base-xv Texto do Acordo Ortográfico de 1990: http://www.portaldalinguaportuguesa.org/?action=acordo&version=1990"},{"id":"hifen-180","frase":"bem-feitor","destaque":"bem-feitor","correta":false,"explicacao":"A observação registra “benfeitor”, aglutinado. “Bem-feitor” não é essa grafia. fonte: grok","regra":"Base XV: “bem” aglutinado em forma consagrada.","fonte":"Acordo Ortográfico da Língua Portuguesa de 1990, Base XV, 4.º, observação. Gabarito: benfeitor. http://www.portaldalinguaportuguesa.org/?action=acordo&id=15-4&version=1990 Texto do Acordo Ortográfico de 1990: http://www.portaldalinguaportuguesa.org/?action=acordo&version=1990"},{"id":"hifen-181","frase":"mal-falante","destaque":"mal-falante","correta":false,"explicacao":"O par do Acordo é “malfalante”, sem hífen. Diante de consoante, “mal” se aglutina; “mal-falante” não é essa forma. fonte: grok","regra":"Base XV: “mal” + consoante se aglutina.","fonte":"Acordo Ortográfico da Língua Portuguesa de 1990, Base XV, 4.º. Gabarito: malfalante. http://www.portaldalinguaportuguesa.org/?action=acordo&id=15-4&version=1990 Texto do Acordo Ortográfico de 1990: http://www.portaldalinguaportuguesa.org/?action=acordo&version=1990"},{"id":"hifen-182","frase":"recémnascido","destaque":"recémnascido","correta":false,"explicacao":"O exemplo oficial é “recém-nascido”, com hífen. “Recémnascido” cola o elemento “recém”. fonte: grok","regra":"Base XV: “recém” com hífen.","fonte":"Acordo Ortográfico da Língua Portuguesa de 1990, Base XV, elementos além, aquém, recém e sem. Gabarito: recém-nascido. https://umportugues.com/acordo/base-xv Texto do Acordo Ortográfico de 1990: http://www.portaldalinguaportuguesa.org/?action=acordo&version=1990"},{"id":"hifen-183","frase":"sem vergonha","destaque":"sem vergonha","correta":false,"explicacao":"O Acordo grafa “sem-vergonha”, com hífen, no rol de “sem”. “Sem vergonha”, solto, não é esse composto. fonte: grok","regra":"Base XV: “sem” com hífen.","fonte":"Acordo Ortográfico da Língua Portuguesa de 1990, Base XV, elementos além, aquém, recém e sem. Gabarito: sem-vergonha. https://umportugues.com/acordo/base-xv Texto do Acordo Ortográfico de 1990: http://www.portaldalinguaportuguesa.org/?action=acordo&version=1990"},{"id":"hifen-184","frase":"além mar","destaque":"além mar","correta":false,"explicacao":"A forma listada é “além-mar”. “Além” liga-se por hífen; “além mar” separa o que o Acordo une. fonte: grok","regra":"Base XV: “além” com hífen.","fonte":"Acordo Ortográfico da Língua Portuguesa de 1990, Base XV, elementos além, aquém, recém e sem. Gabarito: além-mar. https://umportugues.com/acordo/base-xv Texto do Acordo Ortográfico de 1990: http://www.portaldalinguaportuguesa.org/?action=acordo&version=1990"},{"id":"hifen-185","frase":"Pan-americano","destaque":"Pan-americano","correta":true,"explicacao":"A prova pede o hífen correto e o gabarito é C. “Pan-” leva hífen antes de vogal, “m” ou “n”. O Acordo exemplifica “pan-africano”. “Anti-semita”, “auto-aprendizagem” e “micro-radiografia” estão errados: o certo é “antissemita”, “autoaprendizagem” e “microrradiografia”.","regra":"Base XVI, “c”: “pan-” antes de vogal.","fonte":"IBAM – 2025 – Prefeitura de Bebedouro-SP. Gabarito: C. https://www.estudegratis.com.br/questao-de-concurso/1121890 Texto do Acordo Ortográfico de 1990: http://www.portaldalinguaportuguesa.org/?action=acordo&version=1990"},{"id":"hifen-186","frase":"Anti-rábico","destaque":"Anti-rábico","correta":false,"explicacao":"A prova pede a grafia incorreta e o gabarito é A. “Anti” termina em vogal e “rábico” começa por “r”: a consoante dobra e o hífen cai, “antirrábico”. As demais estão certas: “semi-interno”, “micro-ônibus” e “anti-inflacionário”.","regra":"Base XVI: vogal + “r”, consoante dobrada.","fonte":"IVIN – 2025 – Prefeitura de Cajazeiras do Piauí-PI. Gabarito: A. https://www.estudegratis.com.br/questao-de-concurso/1096693 Texto do Acordo Ortográfico de 1990: http://www.portaldalinguaportuguesa.org/?action=acordo&version=1990"},{"id":"hifen-187","frase":"Na pesquisa, os alunos discorreram sobre a história da cultura luso-brasileira.","destaque":"luso-brasileira","correta":true,"explicacao":"A prova pede a alternativa em que o hífen está certo e o gabarito é B. “Luso-brasileira” é adjetivo composto de dois gentílicos, com hífen. As outras falham: “mão-de-obra” é locução, “manda-chuva” se aglutina em “mandachuva” e “dia-a-dia” perdeu o hífen.","regra":"Base XV: adjetivo composto de gentílicos.","fonte":"MS Concursos – 2023 – Prefeitura de Turvelândia-GO – Executor Administrativo. Gabarito: B. https://www.estudegratis.com.br/questao-de-concurso/949176 Texto do Acordo Ortográfico de 1990: http://www.portaldalinguaportuguesa.org/?action=acordo&version=1990"},{"id":"hifen-188","frase":"Auto-aprendizagem","destaque":"Auto-aprendizagem","correta":false,"explicacao":"A prova aponta “macro-componentes” como grafia errada e pede outra no mesmo caso. O gabarito é D. “Auto” termina em “o” e “aprendizagem” começa por “a”, vogais diferentes: o certo é “autoaprendizagem”, exemplo do Acordo.","regra":"Base XVI: vogais diferentes se aglutinam.","fonte":"FUNDATEC – 2023 – Prefeitura de Campo Bom-RS – Professor da Educação Infantil. Gabarito: D. https://www.estudegratis.com.br/questao-de-concurso/946774 Texto do Acordo Ortográfico de 1990: http://www.portaldalinguaportuguesa.org/?action=acordo&version=1990 Exemplo oficial: autoaprendizagem."},{"id":"hifen-189","frase":"mal-habituado","destaque":"mal-habituado","correta":true,"explicacao":"No texto, “mal-amada” leva hífen. A prova pede outra palavra que também deve levar, e o gabarito é C. “Mal” se hifeniza antes de vogal ou “h”. O Priberam registra “mal-habituado”. “Malnascido”, “malmandado”, “malcriado” e “malfalante” não levam hífen.","regra":"Base XV: “mal” + vogal ou “h”.","fonte":"FUNDATEC – 2022 – Prefeitura de Caxias do Sul-RS – Agente Administrativo. Gabarito: C. https://www.estudegratis.com.br/questao-de-concurso/1056308 Priberam, verbete “mal-habituado”: https://dicionario.priberam.org/mal-habituado Texto do Acordo Ortográfico de 1990: http://www.portaldalinguaportuguesa.org/?action=acordo&version=1990"},{"id":"hifen-190","frase":"Super-resistente","destaque":"Super-resistente","correta":true,"explicacao":"A prova pede a única grafia sem incorreção e o gabarito é D. “Super-” leva hífen antes de “r”, como em “super-revista”. “Geopolítica”, “autopeça” e “microcomputador” se escrevem sem hífen.","regra":"Base XVI, “d”: “super-” + “r”.","fonte":"IVIN – 2025 – Prefeitura de Cajazeiras do Piauí-PI. Gabarito: D. https://www.estudegratis.com.br/questao-de-concurso/1108236 Texto do Acordo Ortográfico de 1990: http://www.portaldalinguaportuguesa.org/?action=acordo&version=1990 Exemplo oficial: super-revista."}],"sintaxe":[{"frase":"“O próximo da fila já pode se dirigir ao caixa.” Nessa sentença, “próximo” é adjetivo substantivado com papel de sujeito.","destaque":"adjetivo substantivado","correta":true,"explicacao":"O gabarito é D. “Próximo” deixa de funcionar como adjetivo e vira o núcleo do sujeito de “pode”. Em “flores”, “contraste” e “tintureiro”, o núcleo do sujeito é substantivo. Em “Pensava”, o sujeito não é “remetente”: fica oculto.","regra":"Adjetivo substantivado no sujeito.","fonte":"Avança SP – 2025. Gabarito: D. https://www.estudegratis.com.br/questao-de-concurso/1132160","id":"sintaxe-001"},{"frase":"“As flores lilases coloriram a decoração de uma forma maravilhosa.” Nessa sentença há adjetivo substantivado com papel de sujeito.","destaque":"adjetivo substantivado","correta":false,"explicacao":"O gabarito da Avança SP é “O próximo da fila já pode se dirigir ao caixa”. Aqui “lilases” continua adjetivo, e o núcleo do sujeito é o substantivo “flores”.","regra":"Núcleo do sujeito substantivo.","fonte":"Avança SP – 2025. Gabarito: D. https://www.estudegratis.com.br/questao-de-concurso/1132160","id":"sintaxe-002"},{"frase":"“Havia cinco anos que D. Felicidade o amava.” A oração de “havia” é oração sem sujeito.","destaque":"oração sem sujeito","correta":true,"explicacao":"O gabarito é B. “Haver”, com o sentido de tempo decorrido, é impessoal. “Cinco anos” é complemento, não sujeito.","regra":"Oração sem sujeito: “haver” impessoal.","fonte":"EEAR – 2018. Gabarito: B. https://www.estudegratis.com.br/questao-de-concurso/703854","id":"sintaxe-003"},{"frase":"“Ainda se vivia num mundo de incertezas.” Essa construção é oração sem sujeito.","destaque":"oração sem sujeito","correta":false,"explicacao":"O gabarito da EEAR reserva a oração sem sujeito a “Havia cinco anos que D. Felicidade o amava”. “Viver” é intransitivo, e o “se” indetermina o sujeito.","regra":"Sujeito indeterminado com “se”.","fonte":"EEAR – 2018. Gabarito: B. https://www.estudegratis.com.br/questao-de-concurso/703854","id":"sintaxe-004"},{"frase":"“A transcendência constitui o seu projeto como ser-no-mundo.” “A transcendência” é o sujeito, e “o seu projeto” é o complemento do mesmo verbo.","destaque":"o complemento do mesmo verbo","correta":true,"explicacao":"O gabarito é B. “Constituir” está transitivo direto: o sujeito é “A transcendência” e o objeto direto é “o seu projeto”.","regra":"Sujeito e objeto direto.","fonte":"FCC – 2018. Gabarito: B. https://www.estudegratis.com.br/questao-de-concurso/703667","id":"sintaxe-005"},{"frase":"“A queda de um homem desesperado não é equivalente à de uma pedra.” “Equivalente” é complemento verbal.","destaque":"complemento verbal","correta":false,"explicacao":"O gabarito da FCC é a frase com “constitui”. “Ser” é verbo de ligação, e “equivalente” é predicativo do sujeito.","regra":"Predicativo do sujeito.","fonte":"FCC – 2018. Gabarito: B. https://www.estudegratis.com.br/questao-de-concurso/703667","id":"sintaxe-006"},{"frase":"“Isto se passava em casa de uma baronesa, que tinha a modista ao pé de si.” O período é composto por subordinação.","destaque":"composto por subordinação","correta":true,"explicacao":"O gabarito é D. São duas orações. O “que” é pronome relativo e introduz oração adjetiva, subordinada à principal.","regra":"Período composto por subordinação.","fonte":"UFRJ – 2017. Gabarito: D. https://www.estudegratis.com.br/questao-de-concurso/697909","id":"sintaxe-007"},{"frase":"“Isto se passava em casa de uma baronesa, que tinha a modista ao pé de si.” O período é simples.","destaque":"período é simples","correta":false,"explicacao":"O gabarito é D: duas orações, ligadas por subordinação. O relativo “que” abre a segunda oração. Período simples tem uma oração só.","regra":"Período simples: uma oração.","fonte":"UFRJ – 2017. Gabarito: D. https://www.estudegratis.com.br/questao-de-concurso/697909","id":"sintaxe-008"},{"frase":"“Um doce, moça, compre um doce para mim.” O sujeito dessa oração é oculto.","destaque":"oculto","correta":true,"explicacao":"O gabarito é B. “Compre” está no imperativo e o sujeito é “você”, não expresso. “Moça” apenas chama a pessoa: é vocativo.","regra":"Sujeito oculto no imperativo.","fonte":"CETREDE – 2018. Gabarito: B. https://www.estudegratis.com.br/questao-de-concurso/830867","id":"sintaxe-009"},{"frase":"“Um doce, moça, compre um doce para mim.” O sujeito é o vocativo.","destaque":"o vocativo","correta":false,"explicacao":"O gabarito é B, sujeito oculto. Vocativo não integra a relação sujeito-predicado: “moça” chama o interlocutor e não pratica a ação de “compre”.","regra":"Vocativo não é sujeito.","fonte":"CETREDE – 2018. Gabarito: B. https://www.estudegratis.com.br/questao-de-concurso/830867","id":"sintaxe-010"},{"frase":"“Cumpre trabalharmos bastante.” O sujeito é oracional.","destaque":"oracional","correta":true,"explicacao":"O gabarito é D. “Cumprir”, no sentido de ser preciso, tem como sujeito a oração reduzida de infinitivo “trabalharmos bastante”.","regra":"Sujeito oracional.","fonte":"CETREDE – 2018. Gabarito: D. https://www.estudegratis.com.br/questao-de-concurso/823077","id":"sintaxe-011"},{"frase":"“Havia poucos ingressos à venda.” O sujeito é oracional.","destaque":"oracional","correta":false,"explicacao":"O gabarito do CETREDE aponta sujeito oracional em “Cumpre trabalharmos bastante”. “Haver”, no sentido de existir, não tem sujeito: “poucos ingressos” é objeto direto.","regra":"Oração sem sujeito: “haver” existencial.","fonte":"CETREDE – 2018. Gabarito: D. https://www.estudegratis.com.br/questao-de-concurso/823077","id":"sintaxe-012"},{"frase":"“Oficialmente, não é lugar onde se more.” O sujeito de “more” é indeterminado.","destaque":"indeterminado","correta":true,"explicacao":"O gabarito é E. “Morar” é intransitivo. O “se” é índice de indeterminação do sujeito, e “onde” é adjunto adverbial.","regra":"Sujeito indeterminado.","fonte":"Vunesp – 2018. Gabarito: E. https://www.estudegratis.com.br/questao-de-concurso/704039","id":"sintaxe-013"},{"frase":"“Oficialmente, não é lugar onde se more.” O sujeito de “more” é o pronome relativo.","destaque":"o pronome relativo","correta":false,"explicacao":"O gabarito é E. “Onde” retoma “lugar” como adjunto adverbial. Quem pratica “more” não está nomeado: o sujeito fica indeterminado pelo “se”.","regra":"“Onde” não é o sujeito de “morar”.","fonte":"Vunesp – 2018. Gabarito: E. https://www.estudegratis.com.br/questao-de-concurso/704039","id":"sintaxe-014"},{"frase":"“Ninguém lhes cobrava aluguel, imposto predial, taxa de condomínio.” O sujeito é o pronome indefinido.","destaque":"pronome indefinido","correta":true,"explicacao":"O gabarito é E. “Ninguém” está expresso e é o sujeito simples de “cobrava”. A série “aluguel, imposto predial, taxa de condomínio” é o objeto direto.","regra":"Sujeito simples expresso.","fonte":"Vunesp – 2018. Gabarito: E. https://www.estudegratis.com.br/questao-de-concurso/704039","id":"sintaxe-015"},{"frase":"“O homem vivia tranquilo.” O predicado é verbo-nominal.","destaque":"verbo-nominal","correta":true,"explicacao":"O gabarito é A. “Vivia” conserva noção verbal e “tranquilo” é predicativo do sujeito. As duas partes formam o predicado verbo-nominal.","regra":"Predicado verbo-nominal.","fonte":"Instituto Machado de Assis – 2018. Gabarito: A. https://www.estudegratis.com.br/questao-de-concurso/697869","id":"sintaxe-016"},{"frase":"“Foi com as tropas romanas que o latim chegou à face sul do continente europeu.” O núcleo do sujeito de “chegou” é “latim”.","destaque":"núcleo do sujeito","correta":true,"explicacao":"O gabarito é D. Na oração “o latim chegou”, o sujeito é “o latim”. “Tropas”, “face” e “continente” estão em adjuntos.","regra":"Núcleo do sujeito.","fonte":"Vunesp – 2018. Gabarito: D. https://www.estudegratis.com.br/questao-de-concurso/697855","id":"sintaxe-017"},{"frase":"“Foi com as tropas romanas que o latim chegou à face sul do continente europeu.” O núcleo do sujeito de “chegou” é “tropas”.","destaque":"é “tropas”","correta":false,"explicacao":"O gabarito é D, “latim”. “Com as tropas romanas” é adjunto adverbial de companhia. O sujeito de “chegou” é “o latim”.","regra":"Adjunto adverbial não é o sujeito.","fonte":"Vunesp – 2018. Gabarito: D. https://www.estudegratis.com.br/questao-de-concurso/697855","id":"sintaxe-018"},{"frase":"“Freud era um neurologista.” O predicado é nominal e o sujeito é “Freud”.","destaque":"predicado é nominal","correta":true,"explicacao":"O gabarito é A. “Era” é verbo de ligação e “um neurologista” é predicativo do sujeito. O sujeito é “Freud”.","regra":"Predicado nominal.","fonte":"Vunesp – 2018. Gabarito: A. https://www.estudegratis.com.br/questao-de-concurso/697854","id":"sintaxe-019"},{"frase":"“Freud era um neurologista.” O sujeito é “neurologista”.","destaque":"O sujeito é “neurologista”","correta":false,"explicacao":"O gabarito é A. “Neurologista” é predicativo do sujeito. Quem é o sujeito de “era” é “Freud”.","regra":"Predicativo do sujeito.","fonte":"Vunesp – 2018. Gabarito: A. https://www.estudegratis.com.br/questao-de-concurso/697854","id":"sintaxe-020"},{"frase":"“O médico atendia no hospital, os professores escreviam na biblioteca.” A segunda oração, sem conjunção, é coordenada assindética.","destaque":"coordenada assindética","correta":true,"explicacao":"O gabarito marca 6, assindética. As duas orações se sucedem só pela vírgula, sem conectivo.","regra":"Coordenada assindética.","fonte":"FEPESE – 2017. Gabarito: E. https://www.estudegratis.com.br/questao-de-concurso/697920","id":"sintaxe-021"},{"frase":"“Havia uma multidão, mas não existia tumulto.” A oração introduzida por “mas” é coordenada sindética adversativa.","destaque":"adversativa","correta":true,"explicacao":"O gabarito marca 2, adversativa. “Mas” opõe a segunda oração à primeira.","regra":"Coordenada sindética adversativa.","fonte":"FEPESE – 2017. Gabarito: E. https://www.estudegratis.com.br/questao-de-concurso/697920","id":"sintaxe-022"},{"frase":"“Deixa em paz meu coração, que ele é um pote até aqui de mágoa.” O “que” introduz coordenada sindética explicativa.","destaque":"explicativa","correta":true,"explicacao":"O gabarito marca 5, explicativa. Esse “que” vale por “porque” e justifica o pedido da oração anterior.","regra":"Coordenada sindética explicativa.","fonte":"FEPESE – 2017. Gabarito: E. https://www.estudegratis.com.br/questao-de-concurso/697920","id":"sintaxe-023"},{"frase":"“Sou especialista, logo, só posso atender a casos específicos.” A oração introduzida por “logo” é coordenada sindética conclusiva.","destaque":"conclusiva","correta":true,"explicacao":"O gabarito marca 4, conclusiva. “Logo” apresenta a segunda oração como conclusão da primeira.","regra":"Coordenada sindética conclusiva.","fonte":"FEPESE – 2017. Gabarito: E. https://www.estudegratis.com.br/questao-de-concurso/697920","id":"sintaxe-024"},{"frase":"“Siga o mapa ou peça informação nos postos.” A oração introduzida por “ou” é coordenada sindética alternativa.","destaque":"alternativa","correta":true,"explicacao":"O gabarito marca 3, alternativa. “Ou” põe as duas ordens como opções que se excluem.","regra":"Coordenada sindética alternativa.","fonte":"FEPESE – 2017. Gabarito: E. https://www.estudegratis.com.br/questao-de-concurso/697920","id":"sintaxe-025"},{"frase":"“O rapaz despediu-se de mim e tomou a estrada rumo à sua casa.” A oração introduzida por “e” é coordenada sindética aditiva.","destaque":"aditiva","correta":true,"explicacao":"O gabarito marca 1, aditiva. “E” soma a segunda ação à primeira, sem oposição nem conclusão.","regra":"Coordenada sindética aditiva.","fonte":"FEPESE – 2017. Gabarito: E. https://www.estudegratis.com.br/questao-de-concurso/697920","id":"sintaxe-026"},{"frase":"“Faz parte do ser humano o sentimento de pertencer, integrar algo maior que ele próprio e assumir um ideal comum.” O sujeito se classifica como simples.","destaque":"classifica como simples","correta":true,"explicacao":"O gabarito é C. O núcleo é um só, “sentimento”. Os infinitivos “pertencer”, “integrar” e “assumir” completam esse nome; não são outros sujeitos de “faz”.","regra":"Sujeito simples.","fonte":"IADES – 2019. Gabarito: C. https://www.estudegratis.com.br/questao-de-concurso/823079","id":"sintaxe-027"},{"frase":"“Faz parte do ser humano o sentimento de pertencer, integrar algo maior que ele próprio e assumir um ideal comum.” O sujeito se classifica como indeterminado.","destaque":"classifica como indeterminado","correta":false,"explicacao":"O gabarito é C, sujeito simples. O sujeito está expresso e posposto: “o sentimento de pertencer, integrar algo maior que ele próprio e assumir um ideal comum”.","regra":"Sujeito simples posposto.","fonte":"IADES – 2019. Gabarito: C. https://www.estudegratis.com.br/questao-de-concurso/823079","id":"sintaxe-028"},{"frase":"“Com impressionante frequência, surge um sujeito empunhando um revólver ou um fuzil-metralhadora que começa a disparar a esmo dentro de um shopping ou de uma universidade.” O trecho é um período composto.","destaque":"um período composto","correta":true,"explicacao":"O gabarito é B. Há mais de uma oração: “surge”, a reduzida “empunhando” e “começa”.","regra":"Período composto.","fonte":"Consulplan – 2014. Gabarito: B. https://www.estudegratis.com.br/questao-de-concurso/476717","id":"sintaxe-029"},{"frase":"“Com impressionante frequência, surge um sujeito empunhando um revólver ou um fuzil-metralhadora que começa a disparar a esmo dentro de um shopping ou de uma universidade.” O trecho é um período simples.","destaque":"um período simples","correta":false,"explicacao":"O gabarito é B. “Surge”, “empunhando” e “começa” são orações diferentes. Período simples teria uma oração só.","regra":"Período simples: uma oração.","fonte":"Consulplan – 2014. Gabarito: B. https://www.estudegratis.com.br/questao-de-concurso/476717","id":"sintaxe-030"},{"frase":"No período “Sobe uma classe e dentro dela elevam-se muitos aspirantes a essa camada”, “uma classe” e “muitos aspirantes a essa camada” são sujeitos.","destaque":"são sujeitos","correta":true,"explicacao":"O gabarito é Certo. “Uma classe” é o sujeito de “sobe”. “Muitos aspirantes a essa camada” é o sujeito de “elevam-se”: o verbo concorda com esse substantivo.","regra":"Sujeito de cada uma das duas orações.","fonte":"Cespe/Cebraspe – 2018. Gabarito: Certo. https://www.estudegratis.com.br/questao-de-concurso/704577","id":"sintaxe-031"},{"frase":"Em “Importa destacar”, a oração “destacar” exerce função de sujeito.","destaque":"função de sujeito","correta":true,"explicacao":"O gabarito é Certo. “Importar”, nesse uso, tem como sujeito o infinitivo “destacar”.","regra":"Sujeito oracional reduzido de infinitivo.","fonte":"Cespe/Cebraspe – 2015. Gabarito: Certo. https://www.estudegratis.com.br/questao-de-concurso/591963","id":"sintaxe-032"},{"frase":"“Exceção feita à febre amarela, não existem vacinas para essas doenças.” O sujeito de “existem” é simples.","destaque":"é simples","correta":true,"explicacao":"O gabarito é C. O sujeito é “vacinas para essas doenças”, com um núcleo, “vacinas”. “Exceção feita à febre amarela” não é o sujeito.","regra":"Sujeito simples.","fonte":"IADES – 2014. Gabarito: C. https://www.estudegratis.com.br/questao-de-concurso/475383","id":"sintaxe-033"},{"frase":"“Exceção feita à febre amarela, não existem vacinas para essas doenças.” O sujeito de “existem” é inexistente.","destaque":"é inexistente","correta":false,"explicacao":"O gabarito é C, sujeito simples. “Existir” tem sujeito: “vacinas para essas doenças”. Oração sem sujeito seria o caso de “haver” impessoal, não o deste verbo.","regra":"“Existir” tem sujeito.","fonte":"IADES – 2014. Gabarito: C. https://www.estudegratis.com.br/questao-de-concurso/475383","id":"sintaxe-034"},{"frase":"“Qualquer colisão com outros objetos - mesmo partículas de terra ou gelo - poderia provocar danos.” O sujeito é “qualquer colisão com outros objetos”.","destaque":"qualquer colisão com outros objetos","correta":true,"explicacao":"O gabarito é B. O núcleo do sujeito é “colisão”. O travessão só intercala um esclarecimento, “mesmo partículas de terra ou gelo”. “Danos” é o objeto direto de “provocar”.","regra":"Sujeito simples.","fonte":"FAUEL – 2017. Gabarito: B. https://www.estudegratis.com.br/questao-de-concurso/613764","id":"sintaxe-035"},{"frase":"“Qualquer colisão com outros objetos - mesmo partículas de terra ou gelo - poderia provocar danos.” O sujeito é “outros objetos”.","destaque":"é “outros objetos”","correta":false,"explicacao":"O gabarito é B. “Outros objetos” vem preso a “colisão” pela preposição “com”. O sujeito de “poderia provocar” é “qualquer colisão com outros objetos”.","regra":"O termo preposicionado não é o sujeito.","fonte":"FAUEL – 2017. Gabarito: B. https://www.estudegratis.com.br/questao-de-concurso/613764","id":"sintaxe-036"},{"frase":"“Mas impõe-se a descrição sumária do território.” O sujeito é simples.","destaque":"sujeito é simples","correta":true,"explicacao":"O gabarito é C. O “se” é partícula apassivadora e o sujeito paciente é “a descrição sumária do território”, com um núcleo.","regra":"Sujeito simples na passiva pronominal.","fonte":"IBFC – 2017. Gabarito: C. https://www.estudegratis.com.br/questao-de-concurso/613762","id":"sintaxe-037"},{"frase":"“Mas impõe-se a descrição sumária do território.” O sujeito é oculto.","destaque":"sujeito é oculto","correta":false,"explicacao":"O gabarito é C, sujeito simples. “A descrição sumária do território” está expressa. O “se” apassiva o verbo; não esconde um sujeito “ele” ou “você”.","regra":"Passiva pronominal com sujeito expresso.","fonte":"IBFC – 2017. Gabarito: C. https://www.estudegratis.com.br/questao-de-concurso/613762","id":"sintaxe-038"},{"frase":"“Assaltaram a casa do ministro.” O sujeito é indeterminado.","destaque":"indeterminado","correta":true,"explicacao":"O gabarito é A. O verbo na terceira pessoa do plural, sem sujeito expresso nem retomada, deixa o agente indeterminado. “A casa do ministro” é objeto direto.","regra":"Sujeito indeterminado.","fonte":"IESES – 2017. Gabarito: A. https://www.estudegratis.com.br/questao-de-concurso/613760","id":"sintaxe-039"},{"frase":"“Todos quiseram dar sua opinião.” O sujeito é indeterminado.","destaque":"indeterminado","correta":false,"explicacao":"O gabarito do IESES reserva a indeterminação a “Assaltaram a casa do ministro”. Aqui o sujeito está expresso: “todos”.","regra":"Sujeito simples expresso.","fonte":"IESES – 2017. Gabarito: A. https://www.estudegratis.com.br/questao-de-concurso/613760","id":"sintaxe-040"},{"frase":"“Há pessoas práticas e previdentes que costumam ter uma espécie de lar em conserva; num canto do armário, ao lado de outras coisas enlatadas e que é, como estas, servido às visitas esperadas.” O pronome “que” de “costumam” é sujeito de “costumam”.","destaque":"sujeito de “costumam”","correta":true,"explicacao":"O gabarito considera verdadeira só a afirmativa II. “Que” retoma “pessoas” e é o sujeito de “costumam ter”.","regra":"Pronome relativo como sujeito.","fonte":"IBFC – 2017. Gabarito: B. https://www.estudegratis.com.br/questao-de-concurso/613744","id":"sintaxe-041"},{"frase":"“Há pessoas práticas e previdentes que costumam ter uma espécie de lar em conserva; num canto do armário, ao lado de outras coisas enlatadas e que é, como estas, servido às visitas esperadas.” O período é composto apenas por coordenação.","destaque":"apenas por coordenação","correta":false,"explicacao":"O gabarito considera falsa a afirmativa I. O “que” de “que costumam” é relativo e introduz oração subordinada adjetiva, não uma coordenada.","regra":"Oração subordinada adjetiva.","fonte":"IBFC – 2017. Gabarito: B. https://www.estudegratis.com.br/questao-de-concurso/613744","id":"sintaxe-042"},{"frase":"“Serviram um refrigerante batizado.” O verbo “servir” está transitivo direto.","destaque":"transitivo direto","correta":true,"explicacao":"O gabarito considera corretas as afirmativas II e III. “Um refrigerante batizado” completa “serviram” sem preposição: é objeto direto.","regra":"Objeto direto.","fonte":"IDECAN – 2017. Gabarito: D. https://www.estudegratis.com.br/questao-de-concurso/591969","id":"sintaxe-043"},{"frase":"“Abriu os olhos e viu um fio de luz apenas.” “Os olhos” é objeto direto de “abriu”.","destaque":"objeto direto","correta":true,"explicacao":"O gabarito considera correta a afirmativa III. “Abrir” é transitivo direto, e “os olhos” é o objeto direto.","regra":"Objeto direto.","fonte":"IDECAN – 2017. Gabarito: D. https://www.estudegratis.com.br/questao-de-concurso/591969","id":"sintaxe-044"},{"frase":"“As imagens da festa se transformavam a sua frente.” “As imagens da festa” é sujeito composto.","destaque":"sujeito composto","correta":false,"explicacao":"O gabarito exclui a afirmativa I. O núcleo é um só, “imagens”. Sujeito composto teria mais de um núcleo.","regra":"Sujeito simples.","fonte":"IDECAN – 2017. Gabarito: D. https://www.estudegratis.com.br/questao-de-concurso/591969","id":"sintaxe-045"},{"frase":"“Por maior semelhança, carregam os registros características peculiares.” O sujeito de “carregam” aparece posposto.","destaque":"posposto","correta":true,"explicacao":"O gabarito é C. O sujeito “os registros” vem depois do verbo, e “características peculiares” é o objeto direto.","regra":"Sujeito posposto.","fonte":"FGV – 2014. Gabarito: C. https://www.estudegratis.com.br/questao-de-concurso/475700","id":"sintaxe-046"},{"frase":"“Três atos distintos ocorreram.” O sujeito de “ocorreram” aparece posposto.","destaque":"posposto","correta":false,"explicacao":"O gabarito da FGV é “carregam os registros características peculiares”. Em “três atos distintos ocorreram”, o sujeito “três atos distintos” vem antes do verbo.","regra":"Sujeito anteposto.","fonte":"FGV – 2014. Gabarito: C. https://www.estudegratis.com.br/questao-de-concurso/475700","id":"sintaxe-047"},{"frase":"“Edite desconfia de tudo.” “De tudo” é objeto indireto.","destaque":"objeto indireto","correta":true,"explicacao":"O gabarito é E. “Desconfiar” pede a preposição “de”, e “de tudo” completa o verbo. Nas outras opções, o termo preposicionado completa nome ou é adjunto.","regra":"Objeto indireto.","fonte":"CETREDE – 2018. Gabarito: E. https://www.estudegratis.com.br/questao-de-concurso/823081","id":"sintaxe-048"},{"frase":"“A crença em Deus é necessária.” “Em Deus” é objeto indireto.","destaque":"objeto indireto","correta":false,"explicacao":"O gabarito do CETREDE é “Edite desconfia de tudo”. “Em Deus” completa o substantivo “crença”: é complemento nominal, não objeto indireto.","regra":"Complemento nominal.","fonte":"CETREDE – 2018. Gabarito: E. https://www.estudegratis.com.br/questao-de-concurso/823081","id":"sintaxe-049"},{"frase":"“Se a greve se prolongar”, em “O caos será generalizado, se a greve se prolongar”, a oração destacada é subordinada adverbial condicional.","destaque":"condicional","correta":true,"explicacao":"O gabarito é D. O “se” introduz condição para o caos se generalizar. Não é tempo, finalidade, proporção nem comparação.","regra":"Oração subordinada adverbial condicional.","fonte":"IBADE – 2018. Gabarito: D. https://www.estudegratis.com.br/questao-de-concurso/697795","id":"sintaxe-050"},{"frase":"“Se a greve se prolongar”, em “O caos será generalizado, se a greve se prolongar”, a oração destacada é subordinada adverbial temporal.","destaque":"temporal","correta":false,"explicacao":"O gabarito é D, condicional. “Se” impõe uma hipótese, não situa a oração principal no tempo.","regra":"Oração subordinada adverbial condicional.","fonte":"IBADE – 2018. Gabarito: D. https://www.estudegratis.com.br/questao-de-concurso/697795","id":"sintaxe-051"},{"frase":"No trecho “Os processos de produção dos objetos que nos cercam movimentam relações diversas entre os indivíduos”, o sujeito de “cercam” é “Os processos de produção dos objetos”.","destaque":"o sujeito de “cercam” é “Os processos de produção dos objetos”","correta":false,"explicacao":"O gabarito é Errado. “Cercam” concorda com o relativo “que”, cujo antecedente é “os objetos”. “Os processos de produção dos objetos” é sujeito de “movimentam”.","regra":"Pronome relativo como sujeito.","fonte":"Cespe/Cebraspe – 2019. Gabarito: Errado. https://www.estudegratis.com.br/questao-de-concurso/823075","id":"sintaxe-052"},{"frase":"Na oração “que lhe atribui um valor atual”, o “que” é complemento direto de “atribui”.","destaque":"complemento direto","correta":false,"explicacao":"O gabarito é Errado. “Atribuir” está bitransitivo: o objeto direto é “um valor atual” e o objeto indireto é “lhe”. O “que” é o sujeito.","regra":"Sujeito e objetos de “atribuir”.","fonte":"Cespe/Cebraspe – 2017. Gabarito: Errado. https://www.estudegratis.com.br/questao-de-concurso/697814","id":"sintaxe-053"},{"frase":"Em “Criamos ferramentas que estão rasgando em pedaços o tecido social”, o sujeito da oração principal é indeterminado.","destaque":"indeterminado","correta":false,"explicacao":"O gabarito considera correta só a afirmativa sobre a linguagem conotativa. “Criamos” está na primeira pessoa do plural: o sujeito é desinencial, “nós”, não indeterminado.","regra":"Sujeito desinencial.","fonte":"FUNDATEC – 2019. Gabarito: A. https://www.estudegratis.com.br/questao-de-concurso/823070","id":"sintaxe-054"},{"frase":"Em “Criamos ferramentas que estão rasgando em pedaços o tecido social”, o “que” é conjunção integrante.","destaque":"conjunção integrante","correta":false,"explicacao":"O gabarito exclui essa afirmativa. O “que” retoma “ferramentas” e introduz oração adjetiva: é pronome relativo, não conjunção integrante.","regra":"Pronome relativo.","fonte":"FUNDATEC – 2019. Gabarito: A. https://www.estudegratis.com.br/questao-de-concurso/823070","id":"sintaxe-055"},{"frase":"Em “Completam o top 10 Japão, Alemanha, Finlândia, Israel, Estados Unidos, Suécia, Singapura, França e Reino Unido”, o sujeito é paciente.","destaque":"paciente","correta":false,"explicacao":"O gabarito aponta como incorreta a afirmação de que o sujeito é paciente. “Completam” está na voz ativa. O sujeito é a série de países, composta, e “o top 10” é o objeto direto.","regra":"Sujeito composto na voz ativa.","fonte":"MS Concursos – 2016. Gabarito: C. https://www.estudegratis.com.br/questao-de-concurso/613773","id":"sintaxe-056"},{"frase":"No período “A necessidade de guardar as moedas em segurança fez surgirem os bancos”, “os bancos” é sujeito de “surgirem”.","destaque":"sujeito de “surgirem”","correta":true,"explicacao":"O gabarito é B. “Fazer” causativo traz a oração reduzida “surgirem os bancos”. “Surgir” é intransitivo, e “os bancos” é o sujeito desse infinitivo.","regra":"Sujeito de infinitivo causativo.","fonte":"Cespe/Cebraspe – 2018. Gabarito: B. https://www.estudegratis.com.br/questao-de-concurso/823078","id":"sintaxe-057"},{"frase":"No período “A necessidade de guardar as moedas em segurança fez surgirem os bancos”, “os bancos” é complemento de “surgirem”.","destaque":"complemento de “surgirem”","correta":false,"explicacao":"O gabarito é B, não a alternativa do complemento. “Surgir” não pede objeto. “Os bancos” é o sujeito do infinitivo.","regra":"Sujeito de infinitivo.","fonte":"Cespe/Cebraspe – 2018. Gabarito: B. https://www.estudegratis.com.br/questao-de-concurso/823078","id":"sintaxe-058"},{"frase":"“Ao tomar banho, feche a torneira enquanto se ensaboar.” Cada oração tem um sujeito diferente.","destaque":"um sujeito diferente","correta":false,"explicacao":"O gabarito é E. As três orações têm o mesmo sujeito, “você”: oculto em “tomar” e em “feche”, e também em “ensaboar”.","regra":"Sujeito oculto comum.","fonte":"IBEG – 2014. Gabarito: E. https://www.estudegratis.com.br/questao-de-concurso/476985","id":"sintaxe-059"},{"frase":"“Ao tomar banho, feche a torneira enquanto se ensaboar.” A última oração não possui sujeito.","destaque":"não possui sujeito","correta":false,"explicacao":"O gabarito é E. “Ensaboar” não é verbo impessoal. O “se” é pronome do verbo pronominal, e o sujeito continua sendo “você”.","regra":"Sujeito do verbo pronominal.","fonte":"IBEG – 2014. Gabarito: E. https://www.estudegratis.com.br/questao-de-concurso/476985","id":"sintaxe-060"},{"frase":"“Ao tomar banho, feche a torneira enquanto se ensaboar.” O “se” de “se ensaboar” é partícula apassivadora.","destaque":"partícula apassivadora","correta":false,"explicacao":"O gabarito é E. Não há sujeito paciente de uma passiva. “Ensaboar-se” é pronominal, e o “se” acompanha o sujeito “você”.","regra":"Verbo pronominal.","fonte":"IBEG – 2014. Gabarito: E. https://www.estudegratis.com.br/questao-de-concurso/476985","id":"sintaxe-061"},{"frase":"“Ao tomar banho, feche a torneira enquanto se ensaboar.” Todas as orações contêm predicado verbal.","destaque":"predicado verbal","correta":true,"explicacao":"O gabarito é E. “Banho” e “a torneira” são objetos diretos. “Ensaboar-se” não atribui predicativo ao sujeito. O predicado de cada oração é verbal.","regra":"Predicado verbal.","fonte":"IBEG – 2014. Gabarito: E. https://www.estudegratis.com.br/questao-de-concurso/476985","id":"sintaxe-062"},{"frase":"“Langton afirma que magros acabavam pagando pela gordura alheia.” O “que” introduz oração subordinada substantiva objetiva direta.","destaque":"objetiva direta","correta":true,"explicacao":"O gabarito é D. “Afirmar” é transitivo direto, e a oração introduzida por “que” é o objeto direto. Não é adjetiva: “que” não retoma um nome.","regra":"Oração subordinada substantiva objetiva direta.","fonte":"FUNCAB – 2013. Gabarito: D. https://www.estudegratis.com.br/questao-de-concurso/469480","id":"sintaxe-063"},{"frase":"“Langton afirma que magros acabavam pagando pela gordura alheia.” O “que” introduz oração subordinada adjetiva explicativa.","destaque":"adjetiva explicativa","correta":false,"explicacao":"O gabarito é D, objetiva direta. Não há antecedente nominal nem vírgula de explicação. “Que” é conjunção integrante.","regra":"Conjunção integrante.","fonte":"FUNCAB – 2013. Gabarito: D. https://www.estudegratis.com.br/questao-de-concurso/469480","id":"sintaxe-064"},{"frase":"“Depois a mãe recolhe as velas, torna a guardá-las na bolsa.” O pronome “las” é objeto direto.","destaque":"objeto direto","correta":true,"explicacao":"O gabarito é A. “Las” retoma “as velas” e completa “guardar” sem preposição.","regra":"Objeto direto.","fonte":"IDECAN – 2018. Gabarito: A. https://www.estudegratis.com.br/questao-de-concurso/697794","id":"sintaxe-065"},{"frase":"“E palavras somos.” “Palavras” é predicativo do sujeito.","destaque":"predicativo do sujeito","correta":true,"explicacao":"O gabarito é C. O sujeito de “somos” é desinencial, “nós”. “Palavras”, anteposto, qualifica esse sujeito: é predicativo, não objeto nem sujeito.","regra":"Predicativo do sujeito.","fonte":"IBFC – 2017. Gabarito: C. https://www.estudegratis.com.br/questao-de-concurso/697825","id":"sintaxe-066"},{"frase":"“Garantir aos cidadãos o acesso pleno.” O segmento tem objeto direto e objeto indireto.","destaque":"objeto direto e objeto indireto","correta":true,"explicacao":"O gabarito é A. “Garantir” está bitransitivo: “o acesso pleno” é o objeto direto e “aos cidadãos” é o objeto indireto.","regra":"Objeto direto e objeto indireto.","fonte":"FGV – 2018. Gabarito: A. https://www.estudegratis.com.br/questao-de-concurso/697797","id":"sintaxe-067"},{"frase":"“Coloca a população em risco.” O segmento tem objeto direto e objeto indireto.","destaque":"objeto direto e objeto indireto","correta":false,"explicacao":"O gabarito da FGV é “garantir aos cidadãos o acesso pleno”. Em “coloca a população em risco”, “a população” é objeto direto e “em risco” é predicativo do objeto, não objeto indireto.","regra":"Predicativo do objeto.","fonte":"FGV – 2018. Gabarito: A. https://www.estudegratis.com.br/questao-de-concurso/697797","id":"sintaxe-068"},{"frase":"“O reativo é totalmente o oposto do proativo.” “Totalmente” é adjunto adverbial de intensidade.","destaque":"intensidade","correta":true,"explicacao":"O gabarito é C. “Totalmente” gradua a afirmação. Não indica tempo, modo, afirmação nem inclusão.","regra":"Adjunto adverbial de intensidade.","fonte":"IADES – 2019. Gabarito: C. https://www.estudegratis.com.br/questao-de-concurso/823062","id":"sintaxe-069"},{"frase":"“Meu nobre perdigueiro, vem comigo!” O vocativo é “meu nobre perdigueiro”.","destaque":"vocativo","correta":true,"explicacao":"O gabarito é C. “Meu nobre perdigueiro” chama o interlocutor e fica fora do sujeito e do predicado. O sujeito de “vem” é oculto, “tu”.","regra":"Vocativo.","fonte":"Conrio – 2014 – Prefeitura de Nhandeara. Gabarito: C. https://www.estudegratis.com.br/questao-de-concurso/384348","id":"sintaxe-070"},{"frase":"“Isso gera desvinculação.” O predicado é verbal e há complemento verbal.","destaque":"predicado é verbal","correta":true,"explicacao":"O gabarito é C. “Gerar” é transitivo direto, “desvinculação” é o objeto direto, e o predicado é verbal.","regra":"Predicado verbal com objeto direto.","fonte":"FUNDATEC – 2025. Gabarito: C. https://www.estudegratis.com.br/questao-de-concurso/1130324","id":"sintaxe-071"},{"frase":"“Tendo em vista os últimos acontecimentos, o diretor enviou cartas aos pais e responsáveis.” O verbo pede objeto direto e objeto indireto.","destaque":"objeto direto e objeto indireto","correta":true,"explicacao":"O gabarito é C. “Enviar”, como “vender” no enunciado, é bitransitivo: “cartas” é o objeto direto e “aos pais e responsáveis” é o objeto indireto.","regra":"Verbo bitransitivo.","fonte":"Consulplan – 2017. Gabarito: C. https://www.estudegratis.com.br/questao-de-concurso/697933","id":"sintaxe-072"},{"frase":"“Cláudia chegou, entrou pela sala, almoçou, foi ao banheiro, escovou os dentes, despediu-se e foi trabalhar.” O período tem 7 orações.","destaque":"7 orações","correta":true,"explicacao":"O gabarito é C. Há sete verbos conjugados: chegou, entrou, almoçou, foi, escovou, despediu-se e foi. “Trabalhar” completa o segundo “foi”; a prova não o conta como oitava oração.","regra":"Período composto: uma oração por verbo conjugado.","fonte":"ADM&TEC – 2025 – Prefeitura de João Alfredo-PE. Gabarito: C. https://www.estudegratis.com.br/questao-de-concurso/1117347","id":"sintaxe-073"},{"frase":"“Cláudia chegou, entrou pela sala, almoçou, foi ao banheiro, escovou os dentes, despediu-se e foi trabalhar.” O período tem 5 orações.","destaque":"5 orações","correta":false,"explicacao":"O gabarito é C, sete orações. Chegou, entrou, almoçou, foi, escovou, despediu-se e foi são sete formas conjugadas.","regra":"Período composto: uma oração por verbo conjugado.","fonte":"ADM&TEC – 2025 – Prefeitura de João Alfredo-PE. Gabarito: C. https://www.estudegratis.com.br/questao-de-concurso/1117347","id":"sintaxe-074"},{"frase":"“Nesta casa, precisa-se de costureira.” O sujeito é indeterminado.","destaque":"indeterminado","correta":true,"explicacao":"O gabarito é C. “Precisar” pede a preposição “de”, e o “se” é índice de indeterminação do sujeito. “De costureira” é objeto indireto.","regra":"Sujeito indeterminado.","fonte":"ADM&TEC – 2025 – Prefeitura de João Alfredo-PE. Gabarito: C. https://www.estudegratis.com.br/questao-de-concurso/1117257","id":"sintaxe-075"},{"frase":"“Nesta casa, precisa-se de costureira.” O sujeito é “costureira”.","destaque":"é “costureira”","correta":false,"explicacao":"O gabarito é C, sujeito indeterminado. “Costureira” vem preso a “precisa-se” pela preposição “de”: é objeto indireto.","regra":"Objeto indireto não é o sujeito.","fonte":"ADM&TEC – 2025 – Prefeitura de João Alfredo-PE. Gabarito: C. https://www.estudegratis.com.br/questao-de-concurso/1117257","id":"sintaxe-076"},{"frase":"“Nesta casa, precisa-se de costureira.” O sujeito é simples.","destaque":"é simples","correta":false,"explicacao":"O gabarito é C. Não há núcleo expresso. O “se” com verbo transitivo indireto indetermina o sujeito.","regra":"Sujeito indeterminado.","fonte":"ADM&TEC – 2025 – Prefeitura de João Alfredo-PE. Gabarito: C. https://www.estudegratis.com.br/questao-de-concurso/1117257","id":"sintaxe-077"},{"frase":"“Embora estivesse cansado, ele continuou trabalhando.” A oração inicial é subordinada adverbial concessiva.","destaque":"concessiva","correta":true,"explicacao":"O gabarito é C. “Embora” introduz concessão: ele continuou trabalhando apesar do cansaço. O período é composto por subordinação.","regra":"Oração subordinada adverbial concessiva.","fonte":"JVL Concursos – 2025 – Prefeitura de Ribeiro Gonçalves-PI. Gabarito: C. https://www.estudegratis.com.br/questao-de-concurso/1117131","id":"sintaxe-078"},{"frase":"“Embora estivesse cansado, ele continuou trabalhando.” O período é simples.","destaque":"período é simples","correta":false,"explicacao":"O gabarito é C. Há duas orações: “estivesse cansado” e “continuou trabalhando”. Período simples teria uma só.","regra":"Período composto por subordinação.","fonte":"JVL Concursos – 2025 – Prefeitura de Ribeiro Gonçalves-PI. Gabarito: C. https://www.estudegratis.com.br/questao-de-concurso/1117131","id":"sintaxe-079"},{"frase":"“Embora estivesse cansado, ele continuou trabalhando.” O período é composto por coordenação explicativa.","destaque":"coordenação explicativa","correta":false,"explicacao":"O gabarito é C. “Embora” não explica: concede. A primeira oração é subordinada adverbial concessiva.","regra":"Oração subordinada adverbial concessiva.","fonte":"JVL Concursos – 2025 – Prefeitura de Ribeiro Gonçalves-PI. Gabarito: C. https://www.estudegratis.com.br/questao-de-concurso/1117131","id":"sintaxe-080"},{"frase":"“Se chover, não sairemos de casa.” O período é composto por subordinação.","destaque":"composto por subordinação","correta":true,"explicacao":"O gabarito é C. “Se” impõe a condição de chover para a oração “não sairemos”. São duas orações, ligadas por subordinação.","regra":"Período composto por subordinação.","fonte":"JVL Concursos – 2025 – Prefeitura de Demerval Lobão-PI. Gabarito: C. https://www.estudegratis.com.br/questao-de-concurso/1112726","id":"sintaxe-081"},{"frase":"“Se chover, não sairemos de casa.” O período é simples.","destaque":"período é simples","correta":false,"explicacao":"O gabarito é C. “Chover” e “sairemos” são orações diferentes. O “se” subordina a primeira à segunda.","regra":"Período composto por subordinação.","fonte":"JVL Concursos – 2025 – Prefeitura de Demerval Lobão-PI. Gabarito: C. https://www.estudegratis.com.br/questao-de-concurso/1112726","id":"sintaxe-082"},{"frase":"“Se chover, não sairemos de casa.” O período é composto por coordenação.","destaque":"composto por coordenação","correta":false,"explicacao":"O gabarito é C. “Se” não coordena: a oração da chuva depende da outra. O período é composto por subordinação.","regra":"Oração subordinada adverbial condicional.","fonte":"JVL Concursos – 2025 – Prefeitura de Demerval Lobão-PI. Gabarito: C. https://www.estudegratis.com.br/questao-de-concurso/1112726","id":"sintaxe-083"},{"frase":"“É imprescindível que continuemos tentando.” O período é composto por subordinação.","destaque":"composto por subordinação","correta":true,"explicacao":"O gabarito é A. A oração “que continuemos tentando” é o sujeito de “é imprescindível”. Oração subjetiva é subordinada.","regra":"Oração subordinada substantiva subjetiva.","fonte":"CETREDE – 2025 – Prefeitura de São Benedito-CE. Gabarito: A. https://www.estudegratis.com.br/questao-de-concurso/1112155","id":"sintaxe-084"},{"frase":"“Aprendi com meus erros, mas eu não os faria de novo.” O período é composto por subordinação.","destaque":"composto por subordinação","correta":false,"explicacao":"O gabarito reserva a subordinação a “É imprescindível que continuemos tentando”. “Mas” liga duas orações independentes: a coordenada é adversativa.","regra":"Coordenada sindética adversativa.","fonte":"CETREDE – 2025 – Prefeitura de São Benedito-CE. Gabarito: A. https://www.estudegratis.com.br/questao-de-concurso/1112155","id":"sintaxe-085"},{"frase":"“Caí e me levantei.” O período é composto por subordinação.","destaque":"composto por subordinação","correta":false,"explicacao":"O gabarito é A, outra frase. “E” soma duas orações da mesma camada. O período é composto por coordenação aditiva.","regra":"Coordenada sindética aditiva.","fonte":"CETREDE – 2025 – Prefeitura de São Benedito-CE. Gabarito: A. https://www.estudegratis.com.br/questao-de-concurso/1112155","id":"sintaxe-086"},{"frase":"“Ou permaneço no chão, ou me levanto.” O período é composto por subordinação.","destaque":"composto por subordinação","correta":false,"explicacao":"O gabarito é A, outra frase. “Ou… ou…” põe as orações como alternativas. A relação é de coordenação, não de subordinação.","regra":"Coordenada sindética alternativa.","fonte":"CETREDE – 2025 – Prefeitura de São Benedito-CE. Gabarito: A. https://www.estudegratis.com.br/questao-de-concurso/1112155","id":"sintaxe-087"},{"frase":"“É essencial que você vença a partida.” A oração iniciada por “que” é subordinada substantiva subjetiva.","destaque":"subjetiva","correta":true,"explicacao":"O gabarito é B. “Que você vença a partida” é o sujeito de “é essencial”. Substantiva subjetiva.","regra":"Oração subordinada substantiva subjetiva.","fonte":"ADM&TEC – 2025 – Prefeitura de João Alfredo-PE. Gabarito: B. https://www.estudegratis.com.br/questao-de-concurso/1108278","id":"sintaxe-088"},{"frase":"“A minha vontade é que seja feliz.” A oração iniciada por “que” é subordinada substantiva subjetiva.","destaque":"subjetiva","correta":false,"explicacao":"O gabarito reserva a subjetiva a “É essencial que você vença a partida”. Aqui “que seja feliz” é predicativo de “vontade”: substantiva predicativa.","regra":"Oração subordinada substantiva predicativa.","fonte":"ADM&TEC – 2025 – Prefeitura de João Alfredo-PE. Gabarito: B. https://www.estudegratis.com.br/questao-de-concurso/1108278","id":"sintaxe-089"},{"frase":"“Tenho esperança de que as crianças sejam melhor educadas.” A oração iniciada por “que” é subordinada substantiva subjetiva.","destaque":"subjetiva","correta":false,"explicacao":"O gabarito é B, outra frase. “De que as crianças sejam melhor educadas” completa o nome “esperança”: é substantiva completiva nominal.","regra":"Oração subordinada substantiva completiva nominal.","fonte":"ADM&TEC – 2025 – Prefeitura de João Alfredo-PE. Gabarito: B. https://www.estudegratis.com.br/questao-de-concurso/1108278","id":"sintaxe-090"},{"frase":"“Todo ser humano precisa de paz.” Há oração subordinada substantiva subjetiva.","destaque":"subjetiva","correta":false,"explicacao":"O gabarito é B, outra frase. “Precisa” tem sujeito expresso, “todo ser humano”, e “de paz” é objeto indireto. Não há oração subordinada.","regra":"Período simples.","fonte":"ADM&TEC – 2025 – Prefeitura de João Alfredo-PE. Gabarito: B. https://www.estudegratis.com.br/questao-de-concurso/1108278","id":"sintaxe-091"},{"frase":"“No trajeto para casa, passei pela Cachoeira do Paraitinga.” O sujeito é oculto.","destaque":"oculto","correta":true,"explicacao":"O gabarito é D. “Passei” está na primeira pessoa, e o sujeito “eu” não vem escrito. Nas outras alternativas o sujeito está expresso.","regra":"Sujeito oculto.","fonte":"AGIRH – 2025 – Prefeitura de Silveiras-SP. Gabarito: D. https://www.estudegratis.com.br/questao-de-concurso/1110956","id":"sintaxe-092"},{"frase":"“A médica está com dor na coluna.” O sujeito é oculto.","destaque":"oculto","correta":false,"explicacao":"O gabarito reserva o sujeito oculto a “passei pela Cachoeira do Paraitinga”. Aqui o sujeito está expresso: “a médica”.","regra":"Sujeito simples expresso.","fonte":"AGIRH – 2025 – Prefeitura de Silveiras-SP. Gabarito: D. https://www.estudegratis.com.br/questao-de-concurso/1110956","id":"sintaxe-093"},{"frase":"“Paulo e Ricardo nadavam ao lado da canoa.” O sujeito é oculto.","destaque":"oculto","correta":false,"explicacao":"O gabarito é D, outra frase. “Paulo” e “Ricardo” estão escritos e são dois núcleos: o sujeito é composto.","regra":"Sujeito composto.","fonte":"AGIRH – 2025 – Prefeitura de Silveiras-SP. Gabarito: D. https://www.estudegratis.com.br/questao-de-concurso/1110956","id":"sintaxe-094"},{"frase":"“Regina comprou um livro.” O sujeito é oculto.","destaque":"oculto","correta":false,"explicacao":"O gabarito é D, outra frase. “Regina” é o sujeito simples, expresso, de “comprou”.","regra":"Sujeito simples expresso.","fonte":"AGIRH – 2025 – Prefeitura de Silveiras-SP. Gabarito: D. https://www.estudegratis.com.br/questao-de-concurso/1110956","id":"sintaxe-095"},{"frase":"“O livreiro me disse que eu o acharia apaixonante.” A frase manifesta discurso indireto.","destaque":"discurso indireto","correta":true,"explicacao":"O gabarito é B. “Disse que” relata a fala de outro sem as palavras dele. A oração do “que” é subordinada substantiva objetiva direta.","regra":"Discurso indireto.","fonte":"FGV – 2025 – Prefeitura de Canaã dos Carajás-PA. Gabarito: B. https://www.estudegratis.com.br/questao-de-concurso/1119719","id":"sintaxe-096"},{"frase":"“Eu devia ter mais paciência com ela.” A frase manifesta discurso indireto.","destaque":"discurso indireto","correta":false,"explicacao":"O gabarito é B, a frase do livreiro. Aqui não há verbo de dizer nem oração introduzida por “que”. A fala não é relatada.","regra":"Oração sem verbo dicendi.","fonte":"FGV – 2025 – Prefeitura de Canaã dos Carajás-PA. Gabarito: B. https://www.estudegratis.com.br/questao-de-concurso/1119719","id":"sintaxe-097"},{"frase":"“Tiradentes, heroico, tentou organizar uma revolução.” “Heroico” é predicativo do sujeito.","destaque":"predicativo do sujeito","correta":true,"explicacao":"O gabarito é D: este adjetivo tem função diferente da dos outros. “Heroico”, entre vírgulas, qualifica “Tiradentes” enquanto ele pratica a ação. É predicativo do sujeito, não adjunto adnominal.","regra":"Predicativo do sujeito.","fonte":"FGV – 2025 – Prefeitura de Canaã dos Carajás-PA. Gabarito: D. https://www.estudegratis.com.br/questao-de-concurso/1119710","id":"sintaxe-098"},{"frase":"“Tiradentes, heroico, tentou organizar uma revolução.” “Heroico” é adjunto adnominal.","destaque":"adjunto adnominal","correta":false,"explicacao":"O gabarito aponta esta frase como a de função diferente. “Heroico” não está preso ao nome como adjunto: vem entre vírgulas, com verbo nocional, e é predicativo do sujeito.","regra":"Predicativo do sujeito.","fonte":"FGV – 2025 – Prefeitura de Canaã dos Carajás-PA. Gabarito: D. https://www.estudegratis.com.br/questao-de-concurso/1119710","id":"sintaxe-099"},{"frase":"“Um rosto bonito altera-se depressa.” “Bonito” é adjunto adnominal.","destaque":"adjunto adnominal","correta":true,"explicacao":"O gabarito separa só “Tiradentes, heroico”. “Bonito” restringe “rosto” dentro do sujeito, sem vírgula e sem ser predicativo. É adjunto adnominal.","regra":"Adjunto adnominal.","fonte":"FGV – 2025 – Prefeitura de Canaã dos Carajás-PA. Gabarito: D. https://www.estudegratis.com.br/questao-de-concurso/1119710","id":"sintaxe-100"},{"frase":"“O advérbio exerce função de adjunto adverbial.” A classificação está correta.","destaque":"adjunto adverbial","correta":true,"explicacao":"O gabarito marca como incorreta só a frase que iguala adjunto adnominal e adjunto adverbial. O advérbio, no papel de termo acessório, é adjunto adverbial.","regra":"Adjunto adverbial.","fonte":"IBEC – 2025 – Prefeitura de Tremedal-BA. Gabarito: D. https://www.estudegratis.com.br/questao-de-concurso/1133703","id":"sintaxe-101"},{"frase":"“Os adjuntos adnominais têm a mesma função dos adjuntos adverbiais.” A classificação está correta.","destaque":"a mesma função","correta":false,"explicacao":"O gabarito é D: esta é a afirmativa incorreta. O adjunto adnominal refere-se a um nome. O adjunto adverbial refere-se a verbo, adjetivo ou advérbio. A função não é a mesma.","regra":"Adjunto adnominal e adjunto adverbial.","fonte":"IBEC – 2025 – Prefeitura de Tremedal-BA. Gabarito: D. https://www.estudegratis.com.br/questao-de-concurso/1133703","id":"sintaxe-102"},{"frase":"“A locução adverbial também exerce a função de adjunto adverbial.” A classificação está correta.","destaque":"adjunto adverbial","correta":true,"explicacao":"O gabarito não aponta esta afirmativa como a incorreta. Locução adverbial, como “de manhã” ou “com cuidado”, desempenha o papel de adjunto adverbial.","regra":"Adjunto adverbial.","fonte":"IBEC – 2025 – Prefeitura de Tremedal-BA. Gabarito: D. https://www.estudegratis.com.br/questao-de-concurso/1133703","id":"sintaxe-103"},{"frase":"“Afinal, se queremos algo, além de ter um alto QI, é necessário desenvolver uma sabedoria excepcional.” A oração desenvolvida correspondente à reduzida é “que desenvolvamos uma sabedoria excepcional”.","destaque":"que desenvolvamos","correta":true,"explicacao":"O gabarito é E. “É necessário” pede o subjuntivo na oração desenvolvida. “Desenvolver uma sabedoria excepcional” equivale a “que desenvolvamos uma sabedoria excepcional”.","regra":"Oração desenvolvida no subjuntivo.","fonte":"FGV – 2018 – TJ-SC. Gabarito: E. https://www.estudegratis.com.br/questao-de-concurso/705124","id":"sintaxe-104"},{"frase":"“Afinal, se queremos algo, além de ter um alto QI, é necessário desenvolver uma sabedoria excepcional.” A oração desenvolvida correspondente à reduzida é “que desenvolvemos uma sabedoria excepcional”.","destaque":"que desenvolvemos","correta":false,"explicacao":"O gabarito é E, com subjuntivo. “É necessário que” não leva o indicativo “desenvolvemos”. A forma desenvolvida é “que desenvolvamos”.","regra":"Subjuntivo na oração desenvolvida.","fonte":"FGV – 2018 – TJ-SC. Gabarito: E. https://www.estudegratis.com.br/questao-de-concurso/705124","id":"sintaxe-105"},{"frase":"“Empresas abandonaram o home office?” A passiva correspondente é “O home office foi abandonado por empresas?”","destaque":"foi abandonado","correta":true,"explicacao":"O gabarito é C. “Abandonaram” está no pretérito perfeito. A passiva analítica no mesmo tempo é “foi abandonado”, com o agente “por empresas”.","regra":"Voz passiva analítica.","fonte":"IVIN – 2025 – Prefeitura de Cajazeiras do Piauí-PI. Gabarito: C. https://www.estudegratis.com.br/questao-de-concurso/1116884","id":"sintaxe-106"},{"frase":"“Empresas abandonaram o home office?” A passiva correspondente é “O home office é abandonado por empresas?”","destaque":"é abandonado","correta":false,"explicacao":"O gabarito é C, “foi abandonado”. “É abandonado” está no presente. O pretérito perfeito “abandonaram” pede “foi”.","regra":"Passiva no mesmo tempo do verbo.","fonte":"IVIN – 2025 – Prefeitura de Cajazeiras do Piauí-PI. Gabarito: C. https://www.estudegratis.com.br/questao-de-concurso/1116884","id":"sintaxe-107"},{"frase":"“A revolução silenciosa no campo brasileiro colocou alimentos mais nutritivos, acessíveis e variados no prato de milhões, transformando a realidade de uma nação que, um dia, dependia da importação para sobreviver.” “Alimentos mais nutritivos, acessíveis e variados” é objeto direto de “colocar”.","destaque":"objeto direto","correta":true,"explicacao":"O gabarito considera verdadeira a afirmativa I. “Colocar” pede o que foi posto: “alimentos mais nutritivos, acessíveis e variados”, sem preposição. É objeto direto.","regra":"Objeto direto.","fonte":"InoversaSul – 2025 – UNESC. Gabarito: D. https://www.estudegratis.com.br/questao-de-concurso/1133326","id":"sintaxe-108"},{"frase":"“A revolução silenciosa no campo brasileiro colocou alimentos mais nutritivos, acessíveis e variados no prato de milhões, transformando a realidade de uma nação que, um dia, dependia da importação para sobreviver.” O lugar em que os alimentos foram postos é adjunto adverbial.","destaque":"adjunto adverbial","correta":true,"explicacao":"O gabarito considera verdadeira a afirmativa II. “No prato de milhões” situa a ação de colocar. É adjunto adverbial de lugar.","regra":"Adjunto adverbial de lugar.","fonte":"InoversaSul – 2025 – UNESC. Gabarito: D. https://www.estudegratis.com.br/questao-de-concurso/1133326","id":"sintaxe-109"},{"frase":"“A revolução silenciosa no campo brasileiro colocou alimentos mais nutritivos, acessíveis e variados no prato de milhões, transformando a realidade de uma nação que, um dia, dependia da importação para sobreviver.” O núcleo do sujeito de “colocar” é “campo”.","destaque":"é “campo”","correta":false,"explicacao":"O gabarito exclui a afirmativa III. O sujeito é “a revolução silenciosa no campo brasileiro”, e o núcleo é “revolução”. “Campo” está dentro do adjunto.","regra":"Núcleo do sujeito.","fonte":"InoversaSul – 2025 – UNESC. Gabarito: D. https://www.estudegratis.com.br/questao-de-concurso/1133326","id":"sintaxe-110"},{"frase":"“A revolução silenciosa no campo brasileiro colocou alimentos mais nutritivos, acessíveis e variados no prato de milhões, transformando a realidade de uma nação que, um dia, dependia da importação para sobreviver.” “Dependia” está transitivo indireto.","destaque":"transitivo indireto","correta":true,"explicacao":"O gabarito considera verdadeira a afirmativa IV. “Depender” pede a preposição “de”: “dependia da importação”. É transitivo indireto.","regra":"Verbo transitivo indireto.","fonte":"InoversaSul – 2025 – UNESC. Gabarito: D. https://www.estudegratis.com.br/questao-de-concurso/1133326","id":"sintaxe-111"},{"frase":"“Este é o chamado pensamento divergente, que leva a muitas respostas possíveis.” O período tem duas orações.","destaque":"duas orações","correta":true,"explicacao":"O gabarito é B. “É” forma a primeira oração e “leva”, introduzido pelo relativo “que”, forma a segunda.","regra":"Período composto: duas orações.","fonte":"Máxima – 2025 – Prefeitura de Goiabeira-MG. Gabarito: B. https://www.estudegratis.com.br/questao-de-concurso/1109354","id":"sintaxe-112"},{"frase":"“Este é o chamado pensamento divergente, que leva a muitas respostas possíveis.” O período tem somente uma oração.","destaque":"somente uma oração","correta":false,"explicacao":"O gabarito é B, duas orações. O “que” de “que leva” abre oração adjetiva, além da oração de “é”.","regra":"Oração subordinada adjetiva.","fonte":"Máxima – 2025 – Prefeitura de Goiabeira-MG. Gabarito: B. https://www.estudegratis.com.br/questao-de-concurso/1109354","id":"sintaxe-113"},{"frase":"“Este é o chamado pensamento divergente, que leva a muitas respostas possíveis.” O período tem três orações.","destaque":"três orações","correta":false,"explicacao":"O gabarito é B. Os verbos são “é” e “leva”. “Chamado” não abre outra oração. São duas, não três.","regra":"Período composto: duas orações.","fonte":"Máxima – 2025 – Prefeitura de Goiabeira-MG. Gabarito: B. https://www.estudegratis.com.br/questao-de-concurso/1109354","id":"sintaxe-114"},{"frase":"“A gente se acostuma a acordar de manhã sobressaltado porque está na hora.” O período é composto por subordinação causal.","destaque":"causal","correta":true,"explicacao":"O gabarito é B. “Porque está na hora” dá a causa de acostumar-se a acordar sobressaltado. A oração é subordinada adverbial causal.","regra":"Oração subordinada adverbial causal.","fonte":"EDUCA – 2025 – Prefeitura de Pedras de Fogo-PB. Gabarito: B. https://www.estudegratis.com.br/questao-de-concurso/1119684","id":"sintaxe-115"},{"frase":"“A gente se acostuma a acordar de manhã sobressaltado porque está na hora.” O período é composto por subordinação condicional.","destaque":"condicional","correta":false,"explicacao":"O gabarito é B, causal. “Porque” não impõe hipótese: apresenta o motivo. Não é “se”.","regra":"Oração subordinada adverbial causal.","fonte":"EDUCA – 2025 – Prefeitura de Pedras de Fogo-PB. Gabarito: B. https://www.estudegratis.com.br/questao-de-concurso/1119684","id":"sintaxe-116"},{"frase":"“A gente se acostuma a acordar de manhã sobressaltado porque está na hora.” O período é composto por coordenação assindética.","destaque":"assindética","correta":false,"explicacao":"O gabarito é B. “Porque” é conjunção e subordina a oração da hora à oração de “acostuma”. Não há coordenada assindética.","regra":"Oração subordinada adverbial causal.","fonte":"EDUCA – 2025 – Prefeitura de Pedras de Fogo-PB. Gabarito: B. https://www.estudegratis.com.br/questao-de-concurso/1119684","id":"sintaxe-117"},{"frase":"“A educação proporcionada pelos livros torna-se um antídoto poderoso contra a superficialidade e a desinformação.” O sujeito de “tornar-se” é “A educação proporcionada pelos livros”.","destaque":"sujeito de “tornar-se”","correta":true,"explicacao":"O gabarito é E. “Tornar-se” concorda com “a educação”. “Proporcionada pelos livros” restringe esse núcleo. “Um antídoto poderoso” é o predicativo.","regra":"Sujeito simples.","fonte":"CETREDE – 2025 – Prefeitura de São Benedito-CE. Gabarito: E. https://www.estudegratis.com.br/questao-de-concurso/1127972","id":"sintaxe-118"},{"frase":"“A educação proporcionada pelos livros torna-se um antídoto poderoso contra a superficialidade e a desinformação.” O predicado classifica-se como verbal.","destaque":"classifica-se como verbal","correta":false,"explicacao":"O gabarito exclui essa alternativa. “Tornar-se” liga “a educação” a “um antídoto poderoso”. O predicado é nominal.","regra":"Predicado nominal.","fonte":"CETREDE – 2025 – Prefeitura de São Benedito-CE. Gabarito: E. https://www.estudegratis.com.br/questao-de-concurso/1127972","id":"sintaxe-119"},{"frase":"“A educação proporcionada pelos livros torna-se um antídoto poderoso contra a superficialidade e a desinformação.” “Um antídoto poderoso” é objeto direto.","destaque":"objeto direto","correta":false,"explicacao":"O gabarito exclui essa alternativa. “Tornar-se” é verbo de ligação, e “um antídoto poderoso” é predicativo do sujeito, não objeto direto.","regra":"Predicativo do sujeito.","fonte":"CETREDE – 2025 – Prefeitura de São Benedito-CE. Gabarito: E. https://www.estudegratis.com.br/questao-de-concurso/1127972","id":"sintaxe-120"},{"frase":"“A educação proporcionada pelos livros torna-se um antídoto poderoso contra a superficialidade e a desinformação.” O núcleo do sujeito é “livros”.","destaque":"é “livros”","correta":false,"explicacao":"O gabarito é E. O núcleo é “educação”. “Livros” acompanha o particípio “proporcionada” e não é o núcleo de “torna-se”.","regra":"Núcleo do sujeito.","fonte":"CETREDE – 2025 – Prefeitura de São Benedito-CE. Gabarito: E. https://www.estudegratis.com.br/questao-de-concurso/1127972","id":"sintaxe-121"},{"frase":"“Fala-se muito sobre os riscos das apostas.” O sujeito é indeterminado.","destaque":"indeterminado","correta":true,"explicacao":"O gabarito é A. “Falar” pede “sobre”, e o “se” indetermina o sujeito. Não há núcleo expresso.","regra":"Sujeito indeterminado.","fonte":"FUNDATEC – 2025 – Prefeitura de Erebango-RS. Gabarito: A. https://www.estudegratis.com.br/questao-de-concurso/1109739","id":"sintaxe-122"}]}</script>
<script>
const BANCO = JSON.parse(document.getElementById("banco").textContent);
const TITULOS = { crase: "Crase", hifen: "Hífen", sintaxe: "Análise sintática" };
const TAMANHO = 10;
const tela = document.getElementById("tela");

let tema = null;
let itens = [];
let indice = 0;
let acertos = 0;
let respondida = false;

function embaralhar(lista) {
  const copia = lista.slice();
  for (let i = copia.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    const item = copia[i];
    copia[i] = copia[j];
    copia[j] = item;
  }
  return copia.slice(0, TAMANHO);
}

function limpar(pai) {
  while (pai.firstChild) pai.removeChild(pai.firstChild);
}

function texto(pai, valor, classe) {
  const no = document.createElement(classe === "h1" ? "h1" : "p");
  if (classe && classe !== "h1") no.className = classe;
  no.textContent = valor;
  pai.appendChild(no);
  return no;
}

function botao(pai, rotulo, classe, acao) {
  const no = document.createElement("button");
  no.type = "button";
  no.className = classe;
  no.textContent = rotulo;
  no.addEventListener("click", acao);
  pai.appendChild(no);
  return no;
}

function comentario(pontos, total) {
  if (pontos === total) return "Dez em dez. A rodada fechou sem erro.";
  if (pontos >= 7) return "Bom resultado. Dá para firmar o que ainda oscilou jogando de novo.";
  if (pontos >= 5) return "Metade ou um pouco mais. Vale repetir o tema com outras frases.";
  return "A rodada mostrou o que revisar. A explicação de cada item continua no banco.";
}

function escreverFrase(pai, frase, destaque) {
  const no = document.createElement("p");
  no.className = "frase";
  const inicio = frase.indexOf(destaque);
  if (inicio < 0) {
    no.textContent = frase;
  } else {
    no.appendChild(document.createTextNode(frase.slice(0, inicio)));
    const marca = document.createElement("mark");
    marca.textContent = destaque;
    no.appendChild(marca);
    no.appendChild(document.createTextNode(frase.slice(inicio + destaque.length)));
  }
  pai.appendChild(no);
}

function escreverFonte(pai, fonte) {
  const no = document.createElement("p");
  no.className = "fonte";
  fonte.split(/(https?:\/\/[^\s]+)/).forEach(function (pedaco) {
    if (!/^https?:\/\//.test(pedaco)) {
      no.appendChild(document.createTextNode(pedaco));
      return;
    }
    let url = pedaco;
    let resto = "";
    const corte = url.match(/[)\].,;:]+$/);
    if (corte) {
      resto = corte[0];
      url = url.slice(0, -resto.length);
    }
    const link = document.createElement("a");
    link.href = url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = url;
    no.appendChild(link);
    if (resto) no.appendChild(document.createTextNode(resto));
  });
  pai.appendChild(no);
}

function mostrarMenu() {
  tema = null;
  itens = [];
  limpar(tela);
  texto(tela, "Questões de Português", "h1");
  texto(tela, "Treino de crase, de hífen e de análise sintática com frases de prova. Dez questões por rodada, sem repetir.", "mudo");
  botao(tela, "Crase", "tema", function () { iniciar("crase"); });
  botao(tela, "Hífen", "tema", function () { iniciar("hifen"); });
  botao(tela, "Análise sintática", "tema", function () { iniciar("sintaxe"); });
  texto(tela, "Escolha um tema. Em cada frase, o trecho em destaque está certo ou errado.", "mudo");
  window.scrollTo(0, 0);
}

function iniciar(novoTema) {
  tema = novoTema;
  itens = embaralhar(BANCO[novoTema]);
  indice = 0;
  acertos = 0;
  respondida = false;
  mostrarQuestao();
}

function mostrarQuestao() {
  const questao = itens[indice];
  limpar(tela);
  const topo = document.createElement("div");
  topo.className = "topo";
  const progresso = document.createElement("p");
  progresso.className = "azul";
  progresso.textContent = TITULOS[tema] + "  ·  questão " + (indice + 1) + " de " + TAMANHO;
  topo.appendChild(progresso);
  botao(topo, "Menu", "", function () {
    if (window.confirm("Abandonar esta rodada e voltar ao menu?")) mostrarMenu();
  });
  tela.appendChild(topo);
  escreverFrase(tela, questao.frase, questao.destaque);
  texto(
    tela,
    tema === "sintaxe"
      ? "A classificação destacada está correta?"
      : "O trecho em destaque está de acordo com a norma?",
    "pergunta"
  );
  const par = document.createElement("div");
  par.className = "par";
  const certo = botao(par, "Certo", "certo", function () { responder(true); });
  const errado = botao(par, "Errado", "errado", function () { responder(false); });
  tela.appendChild(par);
  const faixa = document.createElement("div");
  tela.appendChild(faixa);
  const rodape = document.createElement("div");
  rodape.className = "rodape";
  const proxima = botao(rodape, indice === TAMANHO - 1 ? "Ver pontuação" : "Próxima", "primario", avancar);
  proxima.disabled = true;
  proxima.hidden = true;
  tela.appendChild(rodape);

  function responder(usuarioDizQueEstaCorreta) {
    if (respondida) return;
    respondida = true;
    const acertou = usuarioDizQueEstaCorreta === questao.correta;
    if (acertou) acertos += 1;
    certo.disabled = true;
    errado.disabled = true;
    const painel = document.createElement("div");
    painel.className = "feedback";
    painel.style.background = acertou ? "var(--acerto-fundo)" : "var(--erro-fundo)";
    const titulo = document.createElement("p");
    titulo.className = "titulo";
    titulo.style.color = acertou ? "var(--acerto-tinta)" : "var(--erro-tinta)";
    titulo.textContent = acertou ? "Você acertou." : "Você errou.";
    painel.appendChild(titulo);
    const julgamento = document.createElement("p");
    if (tema === "sintaxe") {
      julgamento.textContent = "Pela análise da prova, esta classificação está " + (questao.correta ? "certa." : "errada.");
    } else {
      julgamento.textContent = "Pela norma, este emprego está " + (questao.correta ? "certo." : "errado.");
    }
    painel.appendChild(julgamento);
    const caixa = document.createElement("div");
    caixa.className = "caixa";
    texto(caixa, questao.explicacao, "");
    const regra = texto(caixa, questao.regra, "regra");
    regra.style.marginTop = "8px";
    escreverFonte(caixa, questao.fonte);
    painel.appendChild(caixa);
    faixa.appendChild(painel);
    proxima.hidden = false;
    proxima.disabled = false;
    proxima.textContent = indice === TAMANHO - 1 ? "Ver pontuação" : "Próxima";
    painel.scrollIntoView({ block: "nearest" });
  }

  window.scrollTo(0, 0);
}

function avancar() {
  if (!respondida) return;
  if (indice + 1 >= TAMANHO) {
    mostrarResultado();
    return;
  }
  indice += 1;
  respondida = false;
  mostrarQuestao();
}

function mostrarResultado() {
  limpar(tela);
  texto(tela, TITULOS[tema], "azul centro");
  texto(tela, "Pontuação", "mudo centro");
  const pontos = document.createElement("p");
  pontos.className = "pontos";
  pontos.textContent = acertos + "/" + TAMANHO;
  tela.appendChild(pontos);
  const nota = texto(tela, comentario(acertos, TAMANHO), "mudo centro");
  nota.style.marginBottom = "20px";
  const pilha = document.createElement("div");
  pilha.className = "pilha";
  botao(pilha, "Jogar de novo", "primario", function () { iniciar(tema); });
  botao(pilha, "Voltar ao menu", "secundario", mostrarMenu);
  tela.appendChild(pilha);
  window.scrollTo(0, 0);
}

mostrarMenu();
</script>
</body>
</html>
