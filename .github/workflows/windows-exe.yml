name: Executavel Windows

on:
  push:
    branches:
      - main
      - "cursor/**"
  workflow_dispatch:

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes
        run: |
          python -m pip install pytest
          python -m pytest

      - name: Empacotar
        run: |
          python -m pip install --upgrade pyinstaller
          python -m PyInstaller --noconfirm --clean scripts\questoes_portugues.spec

      - name: Conferir o executavel
        shell: pwsh
        run: |
          $caminho = "dist\QuestoesDePortugues.exe"
          if (-not (Test-Path $caminho)) { throw "O executavel nao foi gerado." }
          $bytes = [System.IO.File]::ReadAllBytes($caminho)
          if ($bytes.Length -lt 1000000 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "O arquivo gerado nao e um executavel de Windows."
          }
          Get-Item $caminho | Format-List FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: QuestoesDePortugues-windows
          path: dist/QuestoesDePortugues.exe
          if-no-files-found: error
